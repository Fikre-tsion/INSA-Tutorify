<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - Tutorify</title>
  <link rel="stylesheet" href="https://unicons.iconscout.com/release/v4.0.8/css/line.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./CSS/style.css">
  <link rel="stylesheet" href="./CSS/contact.css">
</head>
<body>
  <nav>
    <div class="container nav__container">
      <a href="index.html"><h4>Tutorify</h4></a>
      <ul class="nav__menu">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="courses.html">Courses</a></li>
        <li><a href="contact.html" class="active">Contact</a></li>
        <li><a href="login.html">Login</a></li>
      </ul>
      <button id="open-menu-btn" aria-label="Open menu"><i class="uil uil-bars"></i></button>
      <button id="close-menu-btn" aria-label="Close menu"><i class="uil uil-multiply"></i></button>
    </div>
  </nav>

  <section class="contact">
    <div class="container contact__container">
      <aside class="contact__aside">
        <div class="aside__image">
          <img src="./images/contact.svg" alt="Contact Image">
        </div>
        <h2>Contact Us</h2>
        <p>We are here to assist you. Please reach out with any questions.</p>
        <ul class="contact__details">
          <li><i class="uil uil-phone"></i><h5>+251966418467</h5></li>
          <li><i class="uil uil-envelope"></i><h5>tutorifytutoring@gmail.com</h5></li>
        </ul>
      </aside>
  
      <form id="contact-form" class="contact__form">
        <div class="form__name">
          <input type="text" name="firstName" placeholder="First Name" required>
          <input type="text" name="lastName"  placeholder="Last Name" required>
        </div>
        <input type="email" name="email" placeholder="Your Email Address" required>
        <textarea name="message" rows="7" placeholder="Message" required></textarea>
        <button type="submit" id="submit-btn" class="btn btn-primary">Send Message</button>
      </form>
    </div>
  </section>

  <footer>
    <div class="container footer__container">
      <div class="footer__copyright">
        <small>&copy; 2025 <span>Tutorify Tutoring</span>. All Rights Reserved.</small>
      </div>
    </div>
  </footer>

  <script src="./main.js"></script>
  <script>
    const contactForm = document.getElementById('contact-form');
    const submitBtn = document.getElementById('submit-btn');

    contactForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData(contactForm);
      const data = Object.fromEntries(formData.entries());

      submitBtn.textContent = 'Sending...';
      submitBtn.disabled = true;

      try {
        const response = await fetch('/api/contact', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });

        if (response.ok) {
          alert('Message sent successfully!');
          contactForm.reset();
        } else {
          alert('Failed to send message. Please try again.');
        }
      } catch (error) {
        console.error('Error:', error);
        alert('An error occurred.');
      } finally {
        submitBtn.textContent = 'Send Message';
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
