<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tutorify Tutorial Website</title>

  <link rel="stylesheet" href="https://unicons.iconscout.com/release/v4.0.8/css/line.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <style>
    /* Inline styles for contact page to avoid missing CSS files */
    :root {
        --color-primary: #6c63ff;
        --color-white: #fff;
        --color-light: rgba(255, 255, 255, 0.7);
        --color-bg: #1f2641;
        --color-bg1: #2e3267;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; }
    body { background: var(--color-bg); color: var(--color-white); line-height: 1.7; }
    .container { width: 80%; margin: 0 auto; }
    nav { background: transparent; width: 100vw; height: 5rem; position: fixed; top: 0; z-index: 11; display: grid; place-items: center; }
    .nav__container { display: flex; justify-content: space-between; align-items: center; }
    .nav__menu { display: flex; align-items: center; gap: 4rem; list-style: none; }
    .nav__menu a { font-size: 0.9rem; transition: all 400ms ease; color: var(--color-white); text-decoration: none; }
    .nav__menu a:hover { color: var(--color-primary); }

    .contact { margin-top: 8rem; }
    .contact__container { display: grid; grid-template-columns: 40% 60%; gap: 4rem; background: var(--color-bg1); padding: 4rem; border-radius: 2rem; }
    .contact__aside { background: var(--color-primary); padding: 3rem; border-radius: 1rem; position: relative; bottom: 8rem; }
    .aside__image { width: 12rem; margin-bottom: 2rem; }
    .contact__aside h2 { text-align: left; margin-bottom: 1rem; }
    .contact__aside p { font-size: 0.9rem; margin-bottom: 2rem; }
    .contact__details { list-style: none; }
    .contact__details li { display: flex; gap: 1rem; align-items: center; margin-bottom: 1rem; }
    .contact__socials { display: flex; gap: 1.5rem; margin-top: 3rem; list-style: none; }
    .contact__socials a { background: var(--color-bg); padding: 0.5rem; border-radius: 50%; color: var(--color-white); font-size: 0.8rem; transition: all 400ms ease; }
    .contact__socials a:hover { background: transparent; color: var(--color-bg); }

    .contact__form { display: flex; flex-direction: column; gap: 1.2rem; margin-right: 4rem; }
    .form__name { display: flex; gap: 1.2rem; }
    .contact__form input[type="text"], .contact__form input[type="email"], .contact__form textarea { width: 100%; padding: 1rem; background: var(--color-bg); color: var(--color-white); border: none; }
    .btn { display: inline-block; background: var(--color-white); color: #000; padding: 1rem 2rem; border: 1px solid transparent; font-weight: 500; transition: all 400ms ease; cursor: pointer; }
    .btn-primary { background: var(--color-primary); color: var(--color-white); }

    .form__status { padding: 1rem; border-radius: 0.4rem; margin-bottom: 1rem; display: none; text-align: center; }
    .status-success { display: block; background: rgba(0, 255, 0, 0.2); border: 1px solid green; color: lightgreen; }
    .status-error { display: block; background: rgba(255, 0, 0, 0.2); border: 1px solid red; color: pink; }

    label { display: block; margin-bottom: 0.5rem; font-size: 0.8rem; color: var(--color-light); }

    #open-menu-btn, #close-menu-btn { display: none; }

    @media screen and (max-width: 1024px) {
        .contact__container { grid-template-columns: 1fr; gap: 3rem; padding: 0; }
        .contact__aside { width: 100%; bottom: 0; }
        .contact__form { margin: 0 2rem 3rem; }
    }
  </style>
</head>
<body>

  <nav>
    <div class="container nav__container">
      <a href="index.html"><h4>Tutorify</h4></a>
      <ul class="nav__menu">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="courses.html">Courses</a></li>
        <li><a href="contact.html" class="active">Contact</a></li>
      </ul>
      <button id="open-menu-btn" aria-label="Open Navigation Menu"><i class="uil uil-bars"></i></button>
      <button id="close-menu-btn" aria-label="Close Navigation Menu"><i class="uil uil-multiply"></i></button>
    </div>
  </nav>

    <section class="contact">
      <div class="container contact__container">
          <aside class="contact__aside">  
              <div class="aside__image">
                  <img src="https://via.placeholder.com/150" alt="Contact Image">
              </div>
              <h2>Contact Us</h2>
              <p>We are here to assist you. Please reach out to us with any questions or inquiries you may have.</p>
              <ul class="contact__details">
                  <li><i class="uil uil-phone-times"></i><h5>+251966418467</h5></li>
                  <li><i class="uil uil-envelope"></i><h5>tutorifytutoring@gmail.com</h5></li>
                  <li><i class="uil uil-location-point"></i><h5>AddisAbaba, Ethiopia</h5></li>
              </ul>
              <ul class="contact__socials">  
                  <li><a href="https://linkedin.com/Tutorify" target="_blank" aria-label="LinkedIn"><i class="uil uil-linkedin"></i></a></li>
                  <li><a href="https://facebook.com/TutorifyTutoring" target="_blank" aria-label="Facebook"><i class="uil uil-facebook-f"></i></a></li>
                  <li><a href="https://twitter.com/TutorifyTutoring" target="_blank" aria-label="Twitter"><i class="uil uil-twitter"></i></a></li>
                  <li><a href="https://instagram.com/TutorifyTutoring" target="_blank" aria-label="Instagram"><i class="uil uil-instagram"></i></a></li>
              </ul>
          </aside>
  
          <form id="contactForm" class="contact__form">
              <div id="formStatus" class="form__status"></div>
              <div class="form__name">
                  <div>
                      <label for="firstName">First Name</label>
                      <input type="text" id="firstName" name="firstName" placeholder="First Name" required>
                  </div>
                  <div>
                      <label for="lastName">Last Name</label>
                      <input type="text" id="lastName" name="lastName"  placeholder="Last Name" required>
                  </div>
              </div>
              <div>
                  <label for="email">Your Email Address</label>
                  <input type="email" id="email" name="email" placeholder="Your Email Address" required>
              </div>
              <div>
                  <label for="message">Message</label>
                  <textarea id="message" name="message" rows="7" placeholder="Message" required></textarea>
              </div>
              <button type="submit" id="submitBtn" class="btn btn-primary">Send Message</button>
          </form>
      </div>
  </section>

  <script src="./main.js"></script>
  <script>
      const contactForm = document.getElementById('contactForm');
      const submitBtn = document.getElementById('submitBtn');
      const formStatus = document.getElementById('formStatus');

      contactForm.addEventListener('submit', async (e) => {
          e.preventDefault();

          const firstName = document.getElementById('firstName').value;
          const lastName = document.getElementById('lastName').value;
          const email = document.getElementById('email').value;
          const message = document.getElementById('message').value;

          submitBtn.disabled = true;
          submitBtn.textContent = 'Sending...';
          formStatus.className = 'form__status';
          formStatus.textContent = '';

          try {
              const response = await fetch('/api/contact', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ firstName, lastName, email, message })
              });

              const data = await response.json();

              if (response.ok) {
                  formStatus.textContent = data.message || 'Thank you for your message!';
                  formStatus.classList.add('status-success');
                  contactForm.reset();
              } else {
                  throw new Error(data.message || 'Something went wrong.');
              }
          } catch (error) {
              formStatus.textContent = error.message;
              formStatus.classList.add('status-error');
          } finally {
              submitBtn.disabled = false;
              submitBtn.textContent = 'Send Message';
          }
      });
  </script>

</body>
</html>
