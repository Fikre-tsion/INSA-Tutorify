<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login & Register | Tutorify</title>
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }
    body {
      background: #0b132b;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .container {
      background: #1c2541;
      padding: 2rem;
      border-radius: 15px;
      width: 350px;
      box-shadow: 0 0 10px #3a506b;
    }
    h2 {
      text-align: center;
      margin-bottom: 1rem;
      color: #5bc0be;
    }
    .status-msg {
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 1rem;
      font-size: 0.9rem;
      text-align: center;
      display: none;
    }
    .status-msg.error {
      background: rgba(247, 88, 66, 0.2);
      color: #f75842;
      border: 1px solid #f75842;
      display: block;
    }
    .status-msg.success {
      background: rgba(0, 191, 142, 0.2);
      color: #00bf8e;
      border: 1px solid #00bf8e;
      display: block;
    }
    .input-box {
      margin-bottom: 1rem;
    }
    .input-box input, .input-box select {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      outline: none;
      background: #3a506b;
      color: #fff;
    }
    .input-box input:focus-visible, .input-box select:focus-visible {
      outline: 2px solid #5bc0be;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #5bc0be;
      border: none;
      border-radius: 8px;
      color: #0b132b;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover {
      background: #6fffe9;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .toggle {
      text-align: center;
      margin-top: 1rem;
      color: #aaa;
      cursor: pointer;
    }
    .toggle:focus-visible {
      outline: 2px solid #5bc0be;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2 id="formTitle">Login</h2>

    <div id="authStatus" class="status-msg" aria-live="polite"></div>

    <div id="loginForm">
      <div class="input-box">
        <input type="email" id="loginEmail" placeholder="Email" aria-label="Email" required>
      </div>
      <div class="input-box">
        <input type="password" id="loginPassword" placeholder="Password" aria-label="Password" required>
      </div>
      <div class="input-box">
        <select id="loginRole" aria-label="Role">
          <option value="user">User</option>
          <option value="admin">Admin</option>
        </select>
      </div>
      <button id="loginBtn" onclick="login()">Login</button>
      <div class="toggle" tabindex="0" role="button" onclick="toggleForm()" onkeydown="if(event.key==='Enter'||event.key===' ')toggleForm()">Don't have an account? Register</div>
    </div>

    <div id="registerForm" class="hidden">
      <div class="input-box">
        <input type="text" id="regName" placeholder="Full Name" aria-label="Full Name" required>
      </div>
      <div class="input-box">
        <input type="email" id="regEmail" placeholder="Email" aria-label="Email" required>
      </div>
      <div class="input-box">
        <input type="password" id="regPassword" placeholder="Password" aria-label="Password" required>
      </div>
      <button id="regBtn" onclick="register()">Register</button>
      <div class="toggle" tabindex="0" role="button" onclick="toggleForm()" onkeydown="if(event.key==='Enter'||event.key===' ')toggleForm()">Already have an account? Login</div>
    </div>
  </div>

  <script>
    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');
    const formTitle = document.getElementById('formTitle');
    const authStatus = document.getElementById('authStatus');

    function showStatus(msg, isError = false) {
      authStatus.textContent = msg;
      authStatus.className = `status-msg ${isError ? 'error' : 'success'}`;
    }

    function toggleForm() {
      authStatus.style.display = 'none';
      loginForm.classList.toggle('hidden');
      registerForm.classList.toggle('hidden');
      formTitle.textContent = loginForm.classList.contains('hidden') ? 'Register' : 'Login';
    }

    async function register() {
      const name = document.getElementById('regName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value.trim();
      const btn = document.getElementById('regBtn');

      if (!name || !email || !password) {
        showStatus('Please fill in all required fields.', true);
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Registering...';

      try {
        const response = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password })
        });
        const data = await response.json();
        if (response.ok) {
          showStatus('Registration successful! You can now log in.', false);
          toggleForm();
        } else {
          showStatus(data.message || 'Registration failed', true);
        }
      } catch (error) {
        showStatus('An error occurred during registration.', true);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Register';
      }
    }

    async function login() {
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value.trim();
      const role = document.getElementById('loginRole').value;
      const btn = document.getElementById('loginBtn');

      if (!email || !password) {
        showStatus('Please enter email and password.', true);
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Logging in...';

      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password, role })
        });
        const data = await response.json();
        if (response.ok) {
          localStorage.setItem('token', data.token);
          localStorage.setItem('user', JSON.stringify(data.user));
          showStatus(`Welcome ${data.user.name}! Redirecting...`, false);
          setTimeout(() => {
            if (role === 'admin') {
              window.location.href = 'dashboard.html';
            } else {
              window.location.href = 'index.html';
            }
          }, 600);
        } else {
          showStatus(data.message || 'Login failed', true);
        }
      } catch (error) {
        showStatus('An error occurred during login.', true);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Login';
      }
    }
  </script>

</body>
</html>
