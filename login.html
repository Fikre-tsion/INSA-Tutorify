<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login & Register</title>
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }
    body {
      background: #0b132b;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .container {
      background: #1c2541;
      padding: 2rem;
      border-radius: 15px;
      width: 350px;
      box-shadow: 0 0 10px #3a506b;
    }
    h2 {
      text-align: center;
      margin-bottom: 1rem;
      color: #5bc0be;
    }
    .input-box {
      margin-bottom: 1rem;
    }
    .input-box input, .input-box select {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      outline: none;
      background: #3a506b;
      color: #fff;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #5bc0be;
      border: none;
      border-radius: 8px;
      color: #0b132b;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover {
      background: #6fffe9;
    }
    .toggle {
      text-align: center;
      margin-top: 1rem;
      color: #aaa;
      cursor: pointer;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2 id="formTitle">Login</h2>

    <div id="loginForm">
      <div class="input-box">
        <input type="email" id="loginEmail" placeholder="Email" required>
      </div>
      <div class="input-box">
        <input type="password" id="loginPassword" placeholder="Password" required>
      </div>
      <div class="input-box">
        <select id="loginRole">
          <option value="user">User</option>
          <option value="admin">Admin</option>
        </select>
      </div>
      <button onclick="login()">Login</button>
      <div class="toggle" onclick="toggleForm()">Don't have an account? Register</div>
    </div>

    <div id="registerForm" class="hidden">
      <div class="input-box">
        <input type="text" id="regName" placeholder="Full Name" required>
      </div>
      <div class="input-box">
        <input type="email" id="regEmail" placeholder="Email" required>
      </div>
      <div class="input-box">
        <input type="password" id="regPassword" placeholder="Password" required>
      </div>
      <div class="input-box">
        <select id="regRole">
          <option value="user">User</option>
          <option value="admin">Admin</option>
        </select>
      </div>
      <button onclick="register()">Register</button>
      <div class="toggle" onclick="toggleForm()">Already have an account? Login</div>
    </div>
  </div>

  <script>
    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');
    const formTitle = document.getElementById('formTitle');

    function toggleForm() {
      loginForm.classList.toggle('hidden');
      registerForm.classList.toggle('hidden');
      formTitle.textContent = loginForm.classList.contains('hidden') ? 'Register' : 'Login';
    }

    function register() {
      const name = document.getElementById('regName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value.trim();
      const role = document.getElementById('regRole').value;

      if (!name || !email || !password) {
        alert('Please fill in all fields.');
        return;
      }

      const users = JSON.parse(localStorage.getItem('users')) || [];
      const userExists = users.some(user => user.email === email);

      if (userExists) {
        alert('Email already registered!');
        return;
      }

      users.push({ name, email, password, role });
      localStorage.setItem('users', JSON.stringify(users));
      alert('Registration successful! You can now log in.');
      toggleForm();
    }

    function login() {
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value.trim();
      const role = document.getElementById('loginRole').value;

      const users = JSON.parse(localStorage.getItem('users')) || [];
      const user = users.find(u => u.email === email && u.password === password && u.role === role);

      if (!user) {
        alert('Invalid credentials or role!');
        return;
      }

      alert(`Welcome ${user.name}!`);
      if (role === 'admin') {
        window.location.href = 'dashboard.html';
      } else {
        window.location.href = 'index.html';
      }
    }
  </script>

</body>
</html>
