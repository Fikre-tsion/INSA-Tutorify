<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login & Register</title>
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./CSS/style.css">
  <style>
    * {
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }
    body {
      background: #0b132b;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .container {
      background: #1c2541;
      padding: 2rem;
      border-radius: 15px;
      width: 350px;
      box-shadow: 0 0 10px #3a506b;
    }
    h2 {
      text-align: center;
      margin-bottom: 1rem;
      color: #5bc0be;
    }
    .input-box {
      margin-bottom: 1rem;
    }
    .input-box input, .input-box select {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      outline: none;
      background: #3a506b;
      color: #fff;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #5bc0be;
      border: none;
      border-radius: 8px;
      color: #0b132b;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover {
      background: #6fffe9;
    }
    .toggle {
      text-align: center;
      margin-top: 1rem;
      color: #aaa;
      cursor: pointer;
    }
    .hidden {
      display: none;
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border-width: 0;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2 id="formTitle">Login</h2>

    <form id="loginForm" onsubmit="event.preventDefault(); login();">
      <div class="input-box">
        <label for="loginEmail" class="sr-only">Email</label>
        <input type="email" id="loginEmail" placeholder="Email" required>
      </div>
      <div class="input-box">
        <label for="loginPassword" class="sr-only">Password</label>
        <input type="password" id="loginPassword" placeholder="Password" required>
      </div>
      <div class="input-box">
        <label for="loginRole" class="sr-only">Role</label>
        <select id="loginRole">
          <option value="user">User</option>
          <option value="admin">Admin</option>
        </select>
      </div>
      <button type="submit" id="loginBtn">Login</button>
      <div class="toggle" onclick="toggleForm()">Don't have an account? Register</div>
    </form>

    <form id="registerForm" class="hidden" onsubmit="event.preventDefault(); register();">
      <div class="input-box">
        <label for="regName" class="sr-only">Full Name</label>
        <input type="text" id="regName" placeholder="Full Name" required>
      </div>
      <div class="input-box">
        <label for="regEmail" class="sr-only">Email</label>
        <input type="email" id="regEmail" placeholder="Email" required>
      </div>
      <div class="input-box">
        <label for="regPassword" class="sr-only">Password</label>
        <input type="password" id="regPassword" placeholder="Password" required>
      </div>
      <div class="input-box">
        <label for="regRole" class="sr-only">Role</label>
        <select id="regRole">
          <option value="user">User</option>
          <option value="admin">Admin</option>
        </select>
      </div>
      <button type="submit" id="regBtn">Register</button>
      <div class="toggle" onclick="toggleForm()">Already have an account? Login</div>
    </form>
  </div>

  <script>
    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');
    const formTitle = document.getElementById('formTitle');
    const loginBtn = document.getElementById('loginBtn');
    const regBtn = document.getElementById('regBtn');

    function toggleForm() {
      loginForm.classList.toggle('hidden');
      registerForm.classList.toggle('hidden');
      formTitle.textContent = loginForm.classList.contains('hidden') ? 'Register' : 'Login';
    }

    async function register() {
      const name = document.getElementById('regName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value.trim();
      const role = document.getElementById('regRole').value;

      if (!name || !email || !password) {
        alert('Please fill in all fields.');
        return;
      }

      regBtn.disabled = true;
      regBtn.textContent = 'Registering...';

      try {
        const response = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password, role })
        });
        const data = await response.json();
        if (response.ok) {
          alert('Registration successful! You can now log in.');
          toggleForm();
        } else {
          alert(data.message || 'Registration failed');
        }
      } catch (error) {
        console.error('Error during registration:', error);
        alert('An error occurred during registration.');
      } finally {
        regBtn.disabled = false;
        regBtn.textContent = 'Register';
      }
    }

    async function login() {
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value.trim();
      const role = document.getElementById('loginRole').value;

      loginBtn.disabled = true;
      loginBtn.textContent = 'Logging in...';

      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password, role })
        });
        const data = await response.json();
        if (response.ok) {
          localStorage.setItem('token', data.token);
          localStorage.setItem('user', JSON.stringify(data.user));
          if (role === 'admin') {
            window.location.href = 'dashboard.html';
          } else {
            window.location.href = 'index.html';
          }
        } else {
          alert(data.message || 'Login failed');
        }
      } catch (error) {
        console.error('Error during login:', error);
        alert('An error occurred during login.');
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = 'Login';
      }
    }
  </script>

</body>
</html>
