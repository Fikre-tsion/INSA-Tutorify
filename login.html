<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login & Register - Tutorify</title>
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }
    body {
      background: #0b132b;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      background: #1c2541;
      padding: 2rem;
      border-radius: 15px;
      width: 350px;
      box-shadow: 0 0 10px #3a506b;
    }
    h2 {
      text-align: center;
      margin-bottom: 1rem;
      color: #5bc0be;
    }
    .input-box {
      margin-bottom: 1rem;
    }
    .input-box input, .input-box select {
      width: 100%;
      padding: 10px;
      border: 1px solid transparent;
      border-radius: 8px;
      outline: none;
      background: #3a506b;
      color: #fff;
    }
    .input-box input:focus-visible, .input-box select:focus-visible {
      border-color: #6fffe9;
      box-shadow: 0 0 5px #6fffe9;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #5bc0be;
      border: none;
      border-radius: 8px;
      color: #0b132b;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover:not(:disabled) {
      background: #6fffe9;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .toggle {
      text-align: center;
      margin-top: 1rem;
      color: #aaa;
      cursor: pointer;
      padding: 4px;
      border-radius: 4px;
    }
    .toggle:focus-visible {
      outline: 2px solid #6fffe9;
      color: #fff;
    }
    .hidden {
      display: none;
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    .status-msg {
      margin-top: 1rem;
      padding: 8px;
      border-radius: 6px;
      font-size: 0.9rem;
      text-align: center;
      display: none;
    }
    .status-msg.error {
      display: block;
      background: #5c1d24;
      color: #ff9999;
      border: 1px solid #902d37;
    }
    .status-msg.success {
      display: block;
      background: #1b4332;
      color: #80ed99;
      border: 1px solid #2d6a4f;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2 id="formTitle">Login</h2>

    <div id="statusBanner" class="status-msg" aria-live="polite"></div>

    <div id="loginForm">
      <div class="input-box">
        <label for="loginEmail" class="sr-only">Email</label>
        <input type="email" id="loginEmail" placeholder="Email" aria-label="Email Address" required>
      </div>
      <div class="input-box">
        <label for="loginPassword" class="sr-only">Password</label>
        <input type="password" id="loginPassword" placeholder="Password" aria-label="Password" required>
      </div>
      <div class="input-box">
        <label for="loginRole" class="sr-only">Role</label>
        <select id="loginRole" aria-label="Select Role">
          <option value="user">User</option>
          <option value="admin">Admin</option>
        </select>
      </div>
      <button id="loginBtn" onclick="login()" aria-label="Login">Login</button>
      <div class="toggle" id="toggleToRegister" tabindex="0" role="button" aria-label="Switch to Register form" onclick="toggleForm()">Don't have an account? Register</div>
    </div>

    <div id="registerForm" class="hidden">
      <div class="input-box">
        <label for="regName" class="sr-only">Full Name</label>
        <input type="text" id="regName" placeholder="Full Name" aria-label="Full Name" required>
      </div>
      <div class="input-box">
        <label for="regEmail" class="sr-only">Email</label>
        <input type="email" id="regEmail" placeholder="Email" aria-label="Email Address" required>
      </div>
      <div class="input-box">
        <label for="regPassword" class="sr-only">Password</label>
        <input type="password" id="regPassword" placeholder="Password" aria-label="Password" required>
      </div>
      <div class="input-box">
        <label for="regRole" class="sr-only">Role</label>
        <select id="regRole" aria-label="Select Role">
          <option value="user">User</option>
          <option value="admin">Admin</option>
        </select>
      </div>
      <button id="regBtn" onclick="register()" aria-label="Register">Register</button>
      <div class="toggle" id="toggleToLogin" tabindex="0" role="button" aria-label="Switch to Login form" onclick="toggleForm()">Already have an account? Login</div>
    </div>
  </div>

  <script>
    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');
    const formTitle = document.getElementById('formTitle');
    const statusBanner = document.getElementById('statusBanner');

    function showStatus(message, isError = true) {
      statusBanner.textContent = message;
      statusBanner.className = `status-msg ${isError ? 'error' : 'success'}`;
    }

    function clearStatus() {
      statusBanner.textContent = '';
      statusBanner.className = 'status-msg';
    }

    function toggleForm() {
      clearStatus();
      loginForm.classList.toggle('hidden');
      registerForm.classList.toggle('hidden');
      formTitle.textContent = loginForm.classList.contains('hidden') ? 'Register' : 'Login';
    }

    // Keyboard support for form toggle
    document.querySelectorAll('.toggle').forEach(element => {
      element.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          toggleForm();
        }
      });
    });

    async function register() {
      clearStatus();
      const name = document.getElementById('regName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value.trim();
      const role = document.getElementById('regRole').value;
      const btn = document.getElementById('regBtn');

      if (!name || !email || !password) {
        showStatus('Please fill in all fields.');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Registering...';

      try {
        const response = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password, role })
        });
        const data = await response.json();
        if (response.ok) {
          showStatus('Registration successful! You can now log in.', false);
          setTimeout(() => {
            toggleForm();
          }, 1500);
        } else {
          showStatus(data.message || 'Registration failed');
        }
      } catch (error) {
        console.error('Error during registration:', error);
        showStatus('An error occurred during registration.');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Register';
      }
    }

    async function login() {
      clearStatus();
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value.trim();
      const role = document.getElementById('loginRole').value;
      const btn = document.getElementById('loginBtn');

      if (!email || !password) {
        showStatus('Please enter your email and password.');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Logging in...';

      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password, role })
        });
        const data = await response.json();
        if (response.ok) {
          localStorage.setItem('token', data.token);
          localStorage.setItem('user', JSON.stringify(data.user));
          showStatus(`Welcome ${data.user.name}! Redirecting...`, false);
          setTimeout(() => {
            if (role === 'admin') {
              window.location.href = 'dashboard.html';
            } else {
              window.location.href = 'index.html';
            }
          }, 1000);
        } else {
          showStatus(data.message || 'Login failed');
        }
      } catch (error) {
        console.error('Error during login:', error);
        showStatus('An error occurred during login.');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Login';
      }
    }
  </script>

</body>
</html>
