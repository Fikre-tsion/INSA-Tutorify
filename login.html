<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login & Register</title>
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }
    body {
      background: #0b132b;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .container {
      background: #1c2541;
      padding: 2rem;
      border-radius: 15px;
      width: 350px;
      box-shadow: 0 0 10px #3a506b;
    }
    h2 {
      text-align: center;
      margin-bottom: 1rem;
      color: #5bc0be;
    }
    .input-box {
      margin-bottom: 1rem;
    }
    .input-box input, .input-box select {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      outline: none;
      background: #3a506b;
      color: #fff;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #5bc0be;
      border: none;
      border-radius: 8px;
      color: #0b132b;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover {
      background: #6fffe9;
    }
    .toggle {
      text-align: center;
      margin-top: 1rem;
      color: #aaa;
      cursor: pointer;
    }
    .hidden {
      display: none;
    }
    #formStatus {
      padding: 10px;
      margin-bottom: 1rem;
      border-radius: 8px;
      text-align: center;
      font-size: 0.9rem;
      display: none;
    }
    #formStatus.status-success { background: #d4edda; color: #155724; display: block; }
    #formStatus.status-error { background: #f8d7da; color: #721c24; display: block; }
  </style>
</head>
<body>

  <div class="container">
    <h2 id="formTitle">Login</h2>
    <div id="formStatus"></div>

    <div id="loginForm">
      <div class="input-box">
        <input type="email" id="loginEmail" placeholder="Email" required>
      </div>
      <div class="input-box">
        <input type="password" id="loginPassword" placeholder="Password" required>
      </div>
      <div class="input-box">
        <select id="loginRole">
          <option value="user">User</option>
          <option value="admin">Admin</option>
        </select>
      </div>
      <button onclick="login()">Login</button>
      <div class="toggle" onclick="toggleForm()">Don't have an account? Register</div>
    </div>

    <div id="registerForm" class="hidden">
      <div class="input-box">
        <input type="text" id="regName" placeholder="Full Name" required>
      </div>
      <div class="input-box">
        <input type="email" id="regEmail" placeholder="Email" required>
      </div>
      <div class="input-box">
        <input type="password" id="regPassword" placeholder="Password" required>
      </div>
      <div class="input-box">
        <select id="regRole">
          <option value="user">User</option>
          <option value="admin">Admin</option>
        </select>
      </div>
      <button onclick="register()">Register</button>
      <div class="toggle" onclick="toggleForm()">Already have an account? Login</div>
    </div>
  </div>

  <script>
    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');
    const formTitle = document.getElementById('formTitle');
    const formStatus = document.getElementById('formStatus');

    function toggleForm() {
      loginForm.classList.toggle('hidden');
      registerForm.classList.toggle('hidden');
      formTitle.textContent = loginForm.classList.contains('hidden') ? 'Register' : 'Login';
      formStatus.className = '';
    }

    function showStatus(msg, isError) {
      formStatus.textContent = msg;
      formStatus.className = isError ? 'status-error' : 'status-success';
    }

    async function register() {
      const name = document.getElementById('regName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value.trim();
      const role = document.getElementById('regRole').value;
      const btn = document.querySelector('#registerForm button');

      if (!name || !email || !password) return showStatus('Please fill in all fields.', true);

      btn.disabled = true;
      btn.textContent = 'Registering...';
      try {
        const response = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password, role })
        });
        const data = await response.json();
        if (response.ok) {
          showStatus('Registration successful! Loading login...', false);
          setTimeout(toggleForm, 1500);
        } else {
          showStatus(data.message || 'Registration failed', true);
        }
      } catch (error) {
        showStatus('An error occurred during registration.', true);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Register';
      }
    }

    async function login() {
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value.trim();
      const role = document.getElementById('loginRole').value;
      const btn = document.querySelector('#loginForm button');

      btn.disabled = true;
      btn.textContent = 'Logging in...';
      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password, role })
        });
        const data = await response.json();
        if (response.ok) {
          localStorage.setItem('token', data.token);
          localStorage.setItem('user', JSON.stringify(data.user));
          showStatus(`Welcome ${data.user.name}! Redirecting...`, false);
          setTimeout(() => {
            window.location.href = role === 'admin' ? 'dashboard.html' : 'index.html';
          }, 1000);
        } else {
          showStatus(data.message || 'Login failed', true);
        }
      } catch (error) {
        showStatus('An error occurred during login.', true);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Login';
      }
    }
  </script>

</body>
</html>
