<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login & Register - Tutorify</title>
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }
    body {
      background: #0b132b;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      background: #1c2541;
      padding: 2rem;
      border-radius: 15px;
      width: 350px;
      box-shadow: 0 0 10px #3a506b;
    }
    h2 {
      text-align: center;
      margin-bottom: 1rem;
      color: #5bc0be;
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    .input-box {
      margin-bottom: 1rem;
    }
    .input-box input, .input-box select {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      outline: none;
      background: #3a506b;
      color: #fff;
    }
    .input-box input:focus-visible, .input-box select:focus-visible {
      outline: 2px solid #5bc0be;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #5bc0be;
      border: none;
      border-radius: 8px;
      color: #0b132b;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover:not(:disabled) {
      background: #6fffe9;
    }
    button:focus-visible {
      outline: 2px solid #ffffff;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .toggle {
      text-align: center;
      margin-top: 1rem;
      color: #aaa;
      cursor: pointer;
    }
    .toggle:focus-visible {
      outline: 2px dashed #5bc0be;
      outline-offset: 2px;
    }
    .hidden {
      display: none;
    }
    #authStatus {
      min-height: 1.25rem;
      margin-bottom: 1rem;
      text-align: center;
      font-size: 0.9rem;
      font-weight: 500;
    }
    .status-success {
      color: #6fffe9;
    }
    .status-error {
      color: #ff6b6b;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2 id="formTitle">Login</h2>

    <div id="authStatus" aria-live="polite"></div>

    <div id="loginForm">
      <div class="input-box">
        <label for="loginEmail" class="sr-only">Email address</label>
        <input type="email" id="loginEmail" placeholder="Email" aria-label="Email Address" required>
      </div>
      <div class="input-box">
        <label for="loginPassword" class="sr-only">Password</label>
        <input type="password" id="loginPassword" placeholder="Password" aria-label="Password" required>
      </div>
      <div class="input-box">
        <label for="loginRole" class="sr-only">Select Role</label>
        <select id="loginRole" aria-label="Role">
          <option value="user">User</option>
          <option value="admin">Admin</option>
        </select>
      </div>
      <button id="loginBtn" onclick="login()">Login</button>
      <div class="toggle" tabindex="0" role="button" aria-label="Switch to register form" onclick="toggleForm()" onkeydown="handleToggleKey(event)">Don't have an account? Register</div>
    </div>

    <div id="registerForm" class="hidden">
      <div class="input-box">
        <label for="regName" class="sr-only">Full Name</label>
        <input type="text" id="regName" placeholder="Full Name" aria-label="Full Name" required>
      </div>
      <div class="input-box">
        <label for="regEmail" class="sr-only">Email address</label>
        <input type="email" id="regEmail" placeholder="Email" aria-label="Email Address" required>
      </div>
      <div class="input-box">
        <label for="regPassword" class="sr-only">Password</label>
        <input type="password" id="regPassword" placeholder="Password" aria-label="Password" required>
      </div>
      <div class="input-box">
        <label for="regRole" class="sr-only">Select Role</label>
        <select id="regRole" aria-label="Role">
          <option value="user">User</option>
          <option value="admin">Admin</option>
        </select>
      </div>
      <button id="regBtn" onclick="register()">Register</button>
      <div class="toggle" tabindex="0" role="button" aria-label="Switch to login form" onclick="toggleForm()" onkeydown="handleToggleKey(event)">Already have an account? Login</div>
    </div>
  </div>

  <script>
    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');
    const formTitle = document.getElementById('formTitle');
    const authStatus = document.getElementById('authStatus');

    function setStatus(message, isError = true) {
      authStatus.textContent = message;
      authStatus.className = isError ? 'status-error' : 'status-success';
    }

    function clearStatus() {
      authStatus.textContent = '';
      authStatus.className = '';
    }

    function toggleForm() {
      clearStatus();
      loginForm.classList.toggle('hidden');
      registerForm.classList.toggle('hidden');
      formTitle.textContent = loginForm.classList.contains('hidden') ? 'Register' : 'Login';
    }

    function handleToggleKey(event) {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        toggleForm();
      }
    }

    async function register() {
      clearStatus();
      const name = document.getElementById('regName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value.trim();
      const role = document.getElementById('regRole').value;

      if (!name || !email || !password) {
        setStatus('Please fill in all fields.');
        return;
      }

      const regBtn = document.getElementById('regBtn');
      regBtn.disabled = true;
      regBtn.textContent = 'Registering...';

      try {
        const response = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password, role })
        });
        const data = await response.json();
        if (response.ok) {
          setStatus('Registration successful! You can now log in.', false);
          setTimeout(() => {
            toggleForm();
          }, 1200);
        } else {
          setStatus(data.message || 'Registration failed');
        }
      } catch (error) {
        console.error('Error during registration:', error);
        setStatus('An error occurred during registration.');
      } finally {
        regBtn.disabled = false;
        regBtn.textContent = 'Register';
      }
    }

    async function login() {
      clearStatus();
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value.trim();
      const role = document.getElementById('loginRole').value;

      if (!email || !password) {
        setStatus('Please enter your email and password.');
        return;
      }

      const loginBtn = document.getElementById('loginBtn');
      loginBtn.disabled = true;
      loginBtn.textContent = 'Logging in...';

      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password, role })
        });
        const data = await response.json();
        if (response.ok) {
          localStorage.setItem('token', data.token);
          localStorage.setItem('user', JSON.stringify(data.user));
          setStatus(`Welcome ${data.user.name}! Redirecting...`, false);
          setTimeout(() => {
            if (role === 'admin') {
              window.location.href = 'dashboard.html';
            } else {
              window.location.href = 'index.html';
            }
          }, 800);
        } else {
          setStatus(data.message || 'Login failed');
        }
      } catch (error) {
        console.error('Error during login:', error);
        setStatus('An error occurred during login.');
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = 'Login';
      }
    }
  </script>

</body>
</html>
