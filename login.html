<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login & Register - Tutorify</title>
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }
    body {
      background: #0b132b;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .container {
      background: #1c2541;
      padding: 2rem;
      border-radius: 15px;
      width: 380px;
      box-shadow: 0 0 15px rgba(58, 80, 107, 0.5);
    }
    h2 {
      text-align: center;
      margin-bottom: 1.5rem;
      color: #5bc0be;
    }
    .input-box {
      margin-bottom: 1.2rem;
    }
    .input-box label {
      display: block;
      margin-bottom: 0.4rem;
      font-size: 0.85rem;
      color: #cbd5e1;
    }
    .input-box input, .input-box select {
      width: 100%;
      padding: 12px;
      border: 1px solid #3a506b;
      border-radius: 8px;
      outline: none;
      background: #3a506b;
      color: #fff;
      font-size: 0.95rem;
    }
    .input-box input:focus-visible, .input-box select:focus-visible {
      outline: 2px solid #5bc0be;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #5bc0be;
      border: none;
      border-radius: 8px;
      color: #0b132b;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover:not(:disabled) {
      background: #6fffe9;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .toggle {
      text-align: center;
      margin-top: 1.2rem;
      color: #aaa;
      cursor: pointer;
      font-size: 0.9rem;
      text-decoration: underline;
    }
    .toggle:focus-visible {
      outline: 2px solid #5bc0be;
      border-radius: 4px;
    }
    .hidden {
      display: none;
    }
    .alert {
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 1rem;
      font-size: 0.9rem;
      text-align: center;
      display: none;
    }
    .alert-error {
      background-color: #721c24;
      color: #f8d7da;
    }
    .alert-success {
      background-color: #155724;
      color: #d4edda;
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2 id="formTitle">Login</h2>
    <div id="alertMsg" class="alert"></div>

    <!-- Login Form -->
    <div id="loginForm">
      <div class="input-box">
        <label for="loginEmail">Email Address</label>
        <input type="email" id="loginEmail" placeholder="e.g. user@example.com" required aria-label="Email Address">
      </div>
      <div class="input-box">
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" placeholder="Enter your password" required aria-label="Password">
      </div>
      <div class="input-box">
        <label for="loginRole">Account Role</label>
        <select id="loginRole" aria-label="Select Account Role">
          <option value="user">User</option>
          <option value="admin">Admin</option>
        </select>
      </div>
      <button id="loginBtn" onclick="login()">Login</button>
      <div class="toggle" tabindex="0" role="button" onclick="toggleForm()" onkeydown="handleToggleKey(event)">Don't have an account? Register</div>
    </div>

    <!-- Register Form -->
    <div id="registerForm" class="hidden">
      <div class="input-box">
        <label for="regName">Full Name</label>
        <input type="text" id="regName" placeholder="e.g. Jane Doe" required aria-label="Full Name">
      </div>
      <div class="input-box">
        <label for="regEmail">Email Address</label>
        <input type="email" id="regEmail" placeholder="e.g. user@example.com" required aria-label="Email Address">
      </div>
      <div class="input-box">
        <label for="regPassword">Password</label>
        <input type="password" id="regPassword" placeholder="Create a password" required aria-label="Password">
      </div>
      <div class="input-box">
        <label for="regRole">Account Role</label>
        <select id="regRole" aria-label="Select Account Role">
          <option value="user">User</option>
          <option value="admin">Admin</option>
        </select>
      </div>
      <button id="regBtn" onclick="register()">Register</button>
      <div class="toggle" tabindex="0" role="button" onclick="toggleForm()" onkeydown="handleToggleKey(event)">Already have an account? Login</div>
    </div>
  </div>

  <script>
    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');
    const formTitle = document.getElementById('formTitle');
    const alertMsg = document.getElementById('alertMsg');

    function showAlert(msg, isError = true) {
      alertMsg.textContent = msg;
      alertMsg.className = `alert ${isError ? 'alert-error' : 'alert-success'}`;
      alertMsg.style.display = 'block';
    }

    function clearAlert() {
      alertMsg.style.display = 'none';
      alertMsg.textContent = '';
    }

    function toggleForm() {
      clearAlert();
      loginForm.classList.toggle('hidden');
      registerForm.classList.toggle('hidden');
      formTitle.textContent = loginForm.classList.contains('hidden') ? 'Register' : 'Login';
    }

    function handleToggleKey(event) {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        toggleForm();
      }
    }

    async function register() {
      clearAlert();
      const name = document.getElementById('regName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value.trim();
      const role = document.getElementById('regRole').value;
      const regBtn = document.getElementById('regBtn');

      if (!name || !email || !password) {
        showAlert('Please fill in all fields.');
        return;
      }

      regBtn.disabled = true;
      regBtn.textContent = 'Registering...';

      try {
        const response = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password, role })
        });
        const data = await response.json();

        if (response.ok) {
          showAlert('Registration successful! You can now log in.', false);
          setTimeout(() => toggleForm(), 1200);
        } else {
          showAlert(data.message || 'Registration failed.');
        }
      } catch (error) {
        showAlert('Network error during registration.');
      } finally {
        regBtn.disabled = false;
        regBtn.textContent = 'Register';
      }
    }

    async function login() {
      clearAlert();
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value.trim();
      const role = document.getElementById('loginRole').value;
      const loginBtn = document.getElementById('loginBtn');

      if (!email || !password) {
        showAlert('Please enter email and password.');
        return;
      }

      loginBtn.disabled = true;
      loginBtn.textContent = 'Logging in...';

      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password, role })
        });
        const data = await response.json();

        if (response.ok) {
          localStorage.setItem('token', data.token);
          localStorage.setItem('user', JSON.stringify(data.user));
          showAlert(`Welcome ${data.user.name}! Redirecting...`, false);

          setTimeout(() => {
            if (role === 'admin' && data.user.role === 'admin') {
              window.location.href = 'dashboard.html';
            } else {
              window.location.href = 'index.html';
            }
          }, 800);
        } else {
          showAlert(data.message || 'Login failed.');
        }
      } catch (error) {
        showAlert('Network error during login.');
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = 'Login';
      }
    }
  </script>

</body>
</html>
