<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login & Register - Tutorify</title>
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }
    body {
      background: #0b132b;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      background: #1c2541;
      padding: 2rem;
      border-radius: 15px;
      width: 350px;
      box-shadow: 0 0 10px #3a506b;
    }
    h2 {
      text-align: center;
      margin-bottom: 1rem;
      color: #5bc0be;
    }
    .input-box {
      margin-bottom: 1rem;
    }
    .input-box input, .input-box select {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      outline: none;
      background: #3a506b;
      color: #fff;
    }
    .input-box input:focus-visible, .input-box select:focus-visible {
      outline: 2px solid #5bc0be;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #5bc0be;
      border: none;
      border-radius: 8px;
      color: #0b132b;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover {
      background: #6fffe9;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .toggle {
      text-align: center;
      margin-top: 1rem;
      color: #aaa;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .toggle:hover, .toggle:focus-visible {
      color: #6fffe9;
      outline: 1px dashed #6fffe9;
    }
    .hidden {
      display: none;
    }
    #authStatus {
      text-align: center;
      margin-bottom: 1rem;
      font-size: 0.9rem;
      font-weight: 500;
      min-height: 1.2rem;
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border-width: 0;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2 id="formTitle">Login</h2>
    <div id="authStatus" aria-live="polite"></div>

    <div id="loginForm">
      <div class="input-box">
        <label for="loginEmail" class="sr-only">Email Address</label>
        <input type="email" id="loginEmail" placeholder="Email" required aria-label="Email Address">
      </div>
      <div class="input-box">
        <label for="loginPassword" class="sr-only">Password</label>
        <input type="password" id="loginPassword" placeholder="Password" required aria-label="Password">
      </div>
      <div class="input-box">
        <label for="loginRole" class="sr-only">Select Role</label>
        <select id="loginRole" aria-label="Select Role">
          <option value="user">User</option>
          <option value="admin">Admin</option>
        </select>
      </div>
      <button id="loginBtn" onclick="login()">Login</button>
      <div class="toggle" tabindex="0" role="button" onclick="toggleForm()" onkeydown="handleToggleKey(event)">Don't have an account? Register</div>
    </div>

    <div id="registerForm" class="hidden">
      <div class="input-box">
        <label for="regName" class="sr-only">Full Name</label>
        <input type="text" id="regName" placeholder="Full Name" required aria-label="Full Name">
      </div>
      <div class="input-box">
        <label for="regEmail" class="sr-only">Email Address</label>
        <input type="email" id="regEmail" placeholder="Email" required aria-label="Email Address">
      </div>
      <div class="input-box">
        <label for="regPassword" class="sr-only">Password</label>
        <input type="password" id="regPassword" placeholder="Password" required aria-label="Password">
      </div>
      <div class="input-box">
        <label for="regRole" class="sr-only">Select Role</label>
        <select id="regRole" aria-label="Select Role">
          <option value="user">User</option>
          <option value="admin">Admin</option>
        </select>
      </div>
      <button id="regBtn" onclick="register()">Register</button>
      <div class="toggle" tabindex="0" role="button" onclick="toggleForm()" onkeydown="handleToggleKey(event)">Already have an account? Login</div>
    </div>
  </div>

  <script>
    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');
    const formTitle = document.getElementById('formTitle');
    const authStatus = document.getElementById('authStatus');

    function showStatus(msg, isError = false) {
      authStatus.style.color = isError ? '#ff4d4d' : '#00ff88';
      authStatus.textContent = msg;
    }

    function toggleForm() {
      authStatus.textContent = '';
      loginForm.classList.toggle('hidden');
      registerForm.classList.toggle('hidden');
      formTitle.textContent = loginForm.classList.contains('hidden') ? 'Register' : 'Login';
    }

    function handleToggleKey(e) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        toggleForm();
      }
    }

    async function register() {
      const name = document.getElementById('regName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value.trim();
      const role = document.getElementById('regRole').value;
      const regBtn = document.getElementById('regBtn');

      if (!name || !email || !password) {
        showStatus('Please fill in all required fields.', true);
        return;
      }

      regBtn.disabled = true;
      regBtn.textContent = 'Registering...';
      showStatus('Creating your account...');

      try {
        const response = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password, role })
        });
        const data = await response.json();
        if (response.ok) {
          showStatus('Registration successful! You can now log in.');
          setTimeout(() => {
            toggleForm();
          }, 1200);
        } else {
          showStatus(data.message || 'Registration failed', true);
        }
      } catch (error) {
        console.error('Error during registration:', error);
        showStatus('An error occurred during registration.', true);
      } finally {
        regBtn.disabled = false;
        regBtn.textContent = 'Register';
      }
    }

    async function login() {
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value.trim();
      const role = document.getElementById('loginRole').value;
      const loginBtn = document.getElementById('loginBtn');

      if (!email || !password) {
        showStatus('Please enter email and password.', true);
        return;
      }

      loginBtn.disabled = true;
      loginBtn.textContent = 'Logging in...';
      showStatus('Verifying credentials...');

      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password, role })
        });
        const data = await response.json();
        if (response.ok) {
          localStorage.setItem('token', data.token);
          localStorage.setItem('user', JSON.stringify(data.user));
          showStatus(`Welcome ${data.user.name}! Redirecting...`);
          setTimeout(() => {
            if (role === 'admin' || data.user.role === 'admin') {
              window.location.href = 'dashboard.html';
            } else {
              window.location.href = 'index.html';
            }
          }, 800);
        } else {
          showStatus(data.message || 'Login failed', true);
        }
      } catch (error) {
        console.error('Error during login:', error);
        showStatus('An error occurred during login.', true);
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = 'Login';
      }
    }
  </script>

</body>
</html>
