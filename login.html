<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login & Register</title>
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }
    body {
      background: #0b132b;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .container {
      background: #1c2541;
      padding: 2rem;
      border-radius: 15px;
      width: 350px;
      box-shadow: 0 0 10px #3a506b;
    }
    h2 {
      text-align: center;
      margin-bottom: 1rem;
      color: #5bc0be;
    }
    .input-box {
      margin-bottom: 1rem;
    }
    .input-box input, .input-box select {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      outline: none;
      background: #3a506b;
      color: #fff;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #5bc0be;
      border: none;
      border-radius: 8px;
      color: #0b132b;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover {
      background: #6fffe9;
    }
    .toggle {
      text-align: center;
      margin-top: 1rem;
      color: #aaa;
      cursor: pointer;
    }
    .hidden {
      display: none;
    }
    .status-msg {
        text-align: center;
        margin-top: 1rem;
        font-size: 0.9rem;
        min-height: 1.2rem;
    }
    .success { color: #5bc0be; }
    .error { color: #ff6a00; }
  </style>
</head>
<body>

  <div class="container">
    <h2 id="formTitle">Login</h2>

    <div id="loginForm">
      <div class="input-box">
        <input type="email" id="loginEmail" placeholder="Email" required>
      </div>
      <div class="input-box">
        <input type="password" id="loginPassword" placeholder="Password" required>
      </div>
      <div class="input-box">
        <select id="loginRole">
          <option value="user">User</option>
          <option value="admin">Admin</option>
        </select>
      </div>
      <button id="loginBtn" onclick="login()">Login</button>
      <div class="toggle" onclick="toggleForm()">Don't have an account? Register</div>
    </div>

    <div id="registerForm" class="hidden">
      <div class="input-box">
        <input type="text" id="regName" placeholder="Full Name" required>
      </div>
      <div class="input-box">
        <input type="email" id="regEmail" placeholder="Email" required>
      </div>
      <div class="input-box">
        <input type="password" id="regPassword" placeholder="Password" required>
      </div>
      <div class="input-box">
        <select id="regRole">
          <option value="user">User</option>
          <option value="admin">Admin</option>
        </select>
      </div>
      <button id="regBtn" onclick="register()">Register</button>
      <div class="toggle" onclick="toggleForm()">Already have an account? Login</div>
    </div>
    <div id="statusMsg" class="status-msg"></div>
  </div>

  <script>
    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');
    const formTitle = document.getElementById('formTitle');
    const statusMsg = document.getElementById('statusMsg');

    function toggleForm() {
      loginForm.classList.toggle('hidden');
      registerForm.classList.toggle('hidden');
      formTitle.textContent = loginForm.classList.contains('hidden') ? 'Register' : 'Login';
      statusMsg.textContent = '';
    }

    function setStatus(msg, isError = false) {
        statusMsg.textContent = msg;
        statusMsg.className = 'status-msg ' + (isError ? 'error' : 'success');
    }

    async function register() {
      const name = document.getElementById('regName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value.trim();
      const role = document.getElementById('regRole').value;
      const regBtn = document.getElementById('regBtn');

      if (!name || !email || !password) {
        setStatus('Please fill in all fields.', true);
        return;
      }

      regBtn.disabled = true;
      regBtn.textContent = 'Registering...';
      setStatus('');

      try {
        const response = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password, role })
        });
        const data = await response.json();
        if (response.ok) {
          setStatus('Registration successful! Redirecting to login...');
          setTimeout(() => {
              toggleForm();
              regBtn.disabled = false;
              regBtn.textContent = 'Register';
          }, 2000);
        } else {
          setStatus(data.message || 'Registration failed', true);
          regBtn.disabled = false;
          regBtn.textContent = 'Register';
        }
      } catch (error) {
        console.error('Error during registration:', error);
        setStatus('An error occurred during registration.', true);
        regBtn.disabled = false;
        regBtn.textContent = 'Register';
      }
    }

    async function login() {
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value.trim();
      const role = document.getElementById('loginRole').value;
      const loginBtn = document.getElementById('loginBtn');

      loginBtn.disabled = true;
      loginBtn.textContent = 'Logging in...';
      setStatus('');

      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password, role })
        });
        const data = await response.json();
        if (response.ok) {
          localStorage.setItem('token', data.token);
          localStorage.setItem('user', JSON.stringify(data.user));
          setStatus(`Welcome ${data.user.name}! Redirecting...`);
          setTimeout(() => {
              if (role === 'admin') {
                window.location.href = 'dashboard.html';
              } else {
                window.location.href = 'index.html';
              }
          }, 1000);
        } else {
          setStatus(data.message || 'Login failed', true);
          loginBtn.disabled = false;
          loginBtn.textContent = 'Login';
        }
      } catch (error) {
        console.error('Error during login:', error);
        setStatus('An error occurred during login.', true);
        loginBtn.disabled = false;
        loginBtn.textContent = 'Login';
      }
    }
  </script>

</body>
</html>
