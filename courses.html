<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Courses - Tutorify</title>
  <link rel="stylesheet" href="https://unicons.iconscout.com/release/v4.0.8/css/line.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./CSS/style.css">
  <style>
    .courses { padding: 4rem 0; text-align: center; }
    .courses h2 { font-size: 2.5rem; margin-bottom: 2rem; color: #ee7410; }
    .courses__container { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 2rem; }
    .course { background-color: #fff; border-radius: 8px; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); overflow: hidden; transition: 0.3s; }
    .course:hover { transform: translateY(-10px); box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2); }
    .course__image img { width: 100%; height: auto; display: block; }
    .course__info { padding: 1.5rem; text-align: left; }
    .course__info h4 { font-size: 1.25rem; margin-bottom: 1rem; color: #333; }
    .course__info p { font-size: 1rem; margin-bottom: 1.5rem; color: #666; }
  </style>
</head>
<body>
  <nav>
    <div class="container nav__container">
      <a href="index.html"><h4>Tutorify</h4></a>
      <ul class="nav__menu">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="courses.html" class="active">Courses</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="login.html">Login</a></li>
      </ul>
      <button id="open-menu-btn" aria-label="Open menu"><i class="uil uil-bars"></i></button>
      <button id="close-menu-btn" aria-label="Close menu"><i class="uil uil-multiply"></i></button>
    </div>
  </nav>

  <section class="courses">
    <h2>Our Courses</h2>
    <div class="container courses__container" id="all-courses-container">
      <p>Loading all courses...</p>
    </div>
  </section>

  <footer>
    <div class="container footer__container">
      <div class="footer__1">
        <a href="index.html" class="footer__logo"><h4>Tutorify</h4></a>
        <p>Our mission is to empower individuals with knowledge and skills.</p>
      </div>
      <div class="footer__4">
        <h4>Contact Us</h4>
        <div class="footer__socials">
          <a href="#" aria-label="LinkedIn"><i class="uil uil-linkedin"></i></a>
          <a href="#" aria-label="Facebook"><i class="uil uil-facebook-f"></i></a>
        </div>
      </div>
    </div>
  </footer>

  <script src="./main.js"></script>
  <script>
    async function loadAllCourses() {
      try {
        const response = await fetch('/api/courses');
        const courses = await response.json();
        const container = document.getElementById('all-courses-container');
        if (container) {
          container.innerHTML = courses.map(course => `
            <article class="course">
              <div class="course__image">
                <img src="${course.image}" alt="${course.title}" loading="lazy">
              </div>
              <div class="course__info">
                <h4>${course.title}</h4>
                <p>${course.description}</p>
                <a href="#" class="btn btn-primary">Enroll Now</a>
              </div>
            </article>
          `).join('');
        }
      } catch (error) {
        console.error('Error loading courses:', error);
      }
    }
    document.addEventListener('DOMContentLoaded', loadAllCourses);
  </script>
</body>
</html>
