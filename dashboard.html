<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <div class="container">
    <div class="navigation">
      <ul>
        <li>
          <a href="#">
            <span class="icon"><ion-icon name="bulb-outline"></ion-icon></span>
            <span class="title">Tutorify</span>
          </a>
        </li>
        <li>
          <a href="#">
            <span class="icon"><ion-icon name="home-outline"></ion-icon></span>
            <span class="title">Dashboard</span>
          </a>
        </li>
        <li>
          <a href="#">
            <span class="icon"><ion-icon name="person-outline"></ion-icon></span>
            <span class="title">Users</span>
          </a>
        </li>
        <li>
          <a href="#">
            <span class="icon"><ion-icon name="chatbubbles-outline"></ion-icon></span>
            <span class="title">Message</span>
          </a>
        </li>
        <li>
          <a href="#">
            <span class="icon"><ion-icon name="help-outline"></ion-icon></span>
            <span class="title">Help</span>
          </a>
        </li>
        <li>
          <a href="#">
            <span class="icon"><ion-icon name="settings-outline"></ion-icon></span>
            <span class="title">Settings</span>
          </a>
        </li>
        <li>
          <a href="#">
            <span class="icon"><ion-icon name="lock-closed-outline"></ion-icon></span>
            <span class="title">Password</span>
          </a>
        </li>
        <li>
          <a href="#" onclick="logout()">
            <span class="icon"><ion-icon name="log-out-outline"></ion-icon></span>
            <span class="title">Logout</span>
          </a>
        </li>
      </ul>
    </div>

    <div class="main">
      <div class="topbar">
        <div class="toggle">
          <ion-icon name="menu-outline"></ion-icon>
        </div>
        <div class="search">
          <label>
            <input type="text" placeholder="Search here">
            <ion-icon name="search-outline"></ion-icon>
          </label>
        </div>
        <div class="user">
          <img src="./images2/image.png" alt="User Profile" width="120" height="120">
        </div>
      </div>

      <!-- Cards -->
      <div class="cardBox">
        <div class="card">
          <div>
            <div class="numbers" id="stat-views">0</div>
            <div class="cardName">Profile Views</div>
          </div>
          <div class="iconBx">
            <ion-icon name="eye-outline"></ion-icon>
          </div>
        </div>
        <div class="card">
          <div>
            <div class="numbers" id="stat-courses">0</div>
            <div class="cardName">Tutorials</div>
          </div>
          <div class="iconBx">
            <ion-icon name="school-outline"></ion-icon>
          </div>
        </div>
        <div class="card">
          <div>
            <div class="numbers" id="stat-messages">0</div>
            <div class="cardName">Messages</div>
          </div>
          <div class="iconBx">
            <ion-icon name="chatbubbles-outline"></ion-icon>
          </div>
        </div>
        <div class="card">
          <div>
            <div class="numbers" id="stat-users">0</div>
            <div class="cardName">Users</div>
          </div>
          <div class="iconBx">
            <ion-icon name="people-outline"></ion-icon>
          </div>
        </div>
      </div>

      <!-- details lists -->
        <div class="details">
          <div class="recentOrders">
            <div class="cardHeader">
              <h2>Recent Messages</h2>
              <a href="#" class="btn">View All</a>
            </div>
            <table id="messages-table">
              <thead>
                <tr>
                  <td>Name</td>
                  <td>Email</td>
                  <td>Message</td>
                  <td>Status</td>
                </tr>
              </thead>

              <tbody>
                <!-- Dynamic Content -->
              </tbody>
            </table>
          </div>

          <!-- New Customers -->
           <div class="recentCustomers">
            <div class="cardHeader">
              <h2>Recent Users</h2>
            </div>
            <table id="users-table">
              <!-- Dynamic Content -->
            </table>
           </div>

        </div>
    </div>
  </div>

  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>

  <script>
    // Check authentication
    const token = localStorage.getItem('token');
    const user = JSON.parse(localStorage.getItem('user'));

    if (!token || !user || user.role !== 'admin') {
      alert('Access denied. Please login as admin.');
      window.location.href = 'login.html';
    }

    async function fetchStats() {
        try {
            const response = await fetch('/api/stats', {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (response.ok) {
                const data = await response.json();
                document.getElementById('stat-views').textContent = data.views;
                document.getElementById('stat-courses').textContent = data.courseCount;
                document.getElementById('stat-messages').textContent = data.messageCount;
                document.getElementById('stat-users').textContent = data.userCount;

                // Populate Messages
                const messagesBody = document.querySelector('#messages-table tbody');
                messagesBody.innerHTML = '';
                data.recentMessages.forEach(msg => {
                    const tr = document.createElement('tr');

                    const tdName = document.createElement('td');
                    tdName.textContent = `${msg.firstName} ${msg.lastName}`;

                    const tdEmail = document.createElement('td');
                    tdEmail.textContent = msg.email;

                    const tdMsg = document.createElement('td');
                    tdMsg.textContent = msg.message.substring(0, 30) + (msg.message.length > 30 ? '...' : '');
                    tdMsg.title = msg.message;

                    const tdStatus = document.createElement('td');
                    const span = document.createElement('span');
                    span.className = 'status delivered';
                    span.textContent = 'New';
                    tdStatus.appendChild(span);

                    tr.appendChild(tdName);
                    tr.appendChild(tdEmail);
                    tr.appendChild(tdMsg);
                    tr.appendChild(tdStatus);
                    messagesBody.appendChild(tr);
                });

                // Populate Users
                const usersTable = document.getElementById('users-table');
                usersTable.innerHTML = '';
                data.recentUsers.forEach(u => {
                    const tr = document.createElement('tr');

                    const tdImg = document.createElement('td');
                    tdImg.width = '60px';
                    const imgBx = document.createElement('div');
                    imgBx.className = 'imgBx';
                    const img = document.createElement('img');
                    img.src = './images2/student.png';
                    img.alt = 'User';
                    imgBx.appendChild(img);
                    tdImg.appendChild(imgBx);

                    const tdInfo = document.createElement('td');
                    const h4 = document.createElement('h4');
                    h4.textContent = u.name;
                    const br = document.createElement('br');
                    const span = document.createElement('span');
                    span.textContent = u.role;
                    h4.appendChild(br);
                    h4.appendChild(span);
                    tdInfo.appendChild(h4);

                    tr.appendChild(tdImg);
                    tr.appendChild(tdInfo);
                    usersTable.appendChild(tr);
                });
            }
        } catch (error) {
            console.error('Error fetching stats:', error);
        }
    }

    document.addEventListener('DOMContentLoaded', fetchStats);

    function logout() {
      localStorage.removeItem('token');
      localStorage.removeItem('user');
      window.location.href = 'login.html';
    }

    let toggle = document.querySelector('.toggle');
    let navigation = document.querySelector('.navigation');
    let main = document.querySelector('.main');

    if (toggle) {
        toggle.onclick = function() {
          navigation.classList.toggle('active');
          main.classList.toggle('active');
        }
    }
  </script>
  <script>
    document.querySelectorAll('.navigation ul li').forEach(li => {
      li.addEventListener('click', () => {
        document.querySelectorAll('.navigation ul li').forEach(x => x.classList.remove('hovered'));
        li.classList.add('hovered');
      });
    });
  </script>
</body>
</html>
