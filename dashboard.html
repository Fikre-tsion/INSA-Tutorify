<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <div class="container">
    <div class="navigation">
      <ul>
        <li><a href="#"><span class="icon"><ion-icon name="bulb-outline"></ion-icon></span><span class="title">Tutorify</span></a></li>
        <li><a href="#"><span class="icon"><ion-icon name="home-outline"></ion-icon></span><span class="title">Dashboard</span></a></li>
        <li><a href="#"><span class="icon"><ion-icon name="person-outline"></ion-icon></span><span class="title">Users</span></a></li>
        <li><a href="#" onclick="logout()"><span class="icon"><ion-icon name="log-out-outline"></ion-icon></span><span class="title">Logout</span></a></li>
      </ul>
    </div>

    <div class="main">
      <div class="topbar">
        <div class="toggle" aria-label="Toggle navigation"><ion-icon name="menu-outline"></ion-icon></div>
        <div class="search"><label><input type="text" placeholder="Search here"><ion-icon name="search-outline"></ion-icon></label></div>
        <div class="user"><img src="./images2/image.png" alt="User Profile" width="120" height="120" loading="lazy"></div>
      </div>

      <div class="cardBox" id="stats-container">
        <!-- Stats loaded via JS -->
        <p>Loading stats...</p>
      </div>

      <div class="details">
        <div class="recentOrders">
          <div class="cardHeader"><h2>Recent Tutors</h2><a href="#" class="btn">View All</a></div>
          <table id="tutors-table">
            <thead><tr><td>Tutor</td><td>Course</td><td>Payment</td><td>Status</td></tr></thead>
            <tbody><!-- Tutors loaded via JS --></tbody>
          </table>
        </div>

        <div class="recentCustomers">
          <div class="cardHeader"><h2>Recent Customers</h2></div>
          <table id="customers-table">
            <!-- Customers loaded via JS -->
          </table>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>

  <script>
    const token = localStorage.getItem('token');
    const user = JSON.parse(localStorage.getItem('user'));

    if (!token || !user || user.role !== 'admin') {
      alert('Access denied. Please login as admin.');
      window.location.href = 'login.html';
    }

    async function loadDashboard() {
      try {
        const response = await fetch('/api/admin/stats', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (!response.ok) throw new Error('Failed to fetch stats');
        const data = await response.json();

        // Render Stats
        const statsContainer = document.getElementById('stats-container');
        const s = data.stats;
        statsContainer.innerHTML = `
          <div class="card"><div><div class="numbers">${s.profileViews}</div><div class="cardName">Profile Views</div></div><div class="iconBx"><ion-icon name="eye-outline"></ion-icon></div></div>
          <div class="card"><div><div class="numbers">${s.tutorials}</div><div class="cardName">Tutorials</div></div><div class="iconBx"><ion-icon name="school-outline"></ion-icon></div></div>
          <div class="card"><div><div class="numbers">${s.comments}</div><div class="cardName">Comments</div></div><div class="iconBx"><ion-icon name="chatbubbles-outline"></ion-icon></div></div>
          <div class="card"><div><div class="numbers">${s.earnings}</div><div class="cardName">Earnings</div></div><div class="iconBx"><ion-icon name="cash-outline"></ion-icon></div></div>
        `;

        // Render Tutors
        const tutorsTable = document.getElementById('tutors-table').querySelector('tbody');
        tutorsTable.innerHTML = data.tutors.map(t => `
          <tr><td>${t.name}</td><td>${t.course}</td><td>${t.payment}</td><td><span class="status ${t.status}">${t.status}</span></td></tr>
        `).join('');

        // Render Customers
        const customersTable = document.getElementById('customers-table');
        customersTable.innerHTML = data.customers.map(c => `
          <tr><td width="60px"><div class="imgBx"><img src="${c.image}" alt="${c.name}" loading="lazy"></div></td><td><h4>${c.name}<br><span>${c.grade}</span></h4></td></tr>
        `).join('');

      } catch (error) {
        console.error('Dashboard Error:', error);
      }
    }

    function logout() {
      localStorage.removeItem('token');
      localStorage.removeItem('user');
      window.location.href = 'login.html';
    }

    document.querySelector('.toggle').onclick = function() {
      document.querySelector('.navigation').classList.toggle('active');
      document.querySelector('.main').classList.toggle('active');
    }

    document.addEventListener('DOMContentLoaded', loadDashboard);
  </script>
</body>
</html>
