<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Tutorify</title>
  <link rel="stylesheet" href="dashboard.css">
  <style>
    .table-responsive {
      width: 100%;
      overflow-x: auto;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="navigation">
      <ul>
        <li>
          <a href="index.html">
            <span class="icon"><ion-icon name="bulb-outline"></ion-icon></span>
            <span class="title">Tutorify</span>
          </a>
        </li>
        <li>
          <a href="dashboard.html">
            <span class="icon"><ion-icon name="home-outline"></ion-icon></span>
            <span class="title">Dashboard</span>
          </a>
        </li>
        <li>
          <a href="#">
            <span class="icon"><ion-icon name="person-outline"></ion-icon></span>
            <span class="title">Users</span>
          </a>
        </li>
        <li>
          <a href="#">
            <span class="icon"><ion-icon name="chatbubbles-outline"></ion-icon></span>
            <span class="title">Message</span>
          </a>
        </li>
        <li>
          <a href="#" onclick="logout(event)">
            <span class="icon"><ion-icon name="log-out-outline"></ion-icon></span>
            <span class="title">Logout</span>
          </a>
        </li>
      </ul>
    </div>

    <div class="main">
      <div class="topbar">
        <div class="toggle" tabindex="0" role="button" aria-label="Toggle navigation">
          <ion-icon name="menu-outline"></ion-icon>
        </div>
        <div class="search">
          <label>
            <input type="text" placeholder="Search here" aria-label="Search">
            <ion-icon name="search-outline"></ion-icon>
          </label>
        </div>
        <div class="user">
          <img src="./digitalmarketing.png" alt="User Profile" width="120" height="120" onerror="this.src='./digitalmarketing.png'">
        </div>
      </div>

      <!-- Cards -->
      <div class="cardBox">
        <div class="card">
          <div>
            <div class="numbers">1,504</div>
            <div class="cardName">Profile Views</div>
          </div>
          <div class="iconBx">
            <ion-icon name="eye-outline"></ion-icon>
          </div>
        </div>
        <div class="card">
          <div>
            <div class="numbers">80</div>
            <div class="cardName">Tutorials</div>
          </div>
          <div class="iconBx">
            <ion-icon name="school-outline"></ion-icon>
          </div>
        </div>
        <div class="card">
          <div>
            <div class="numbers">0</div>
            <div class="cardName">Messages</div>
          </div>
          <div class="iconBx">
            <ion-icon name="chatbubbles-outline"></ion-icon>
          </div>
        </div>
        <div class="card">
          <div>
            <div class="numbers">1</div>
            <div class="cardName">Registered Users</div>
          </div>
          <div class="iconBx">
            <ion-icon name="people-outline"></ion-icon>
          </div>
        </div>
      </div>

      <!-- Details Lists -->
      <div class="details">
        <div class="recentOrders">
          <div class="cardHeader">
            <h2>Recent Messages</h2>
            <a href="#" class="btn">View All</a>
          </div>
          <div class="table-responsive">
            <table>
              <thead>
                <tr>
                  <td>Sender</td>
                  <td>Message</td>
                  <td>Date</td>
                  <td>Status</td>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td colspan="4" style="text-align:center;">Loading messages...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

        <!-- Recent Customers -->
        <div class="recentCustomers">
          <div class="cardHeader">
            <h2>Recent Users</h2>
          </div>
          <div class="table-responsive">
            <table>
              <tbody>
                <tr>
                  <td colspan="2" style="text-align:center;">Loading users...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
