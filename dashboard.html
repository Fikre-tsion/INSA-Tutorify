<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Tutorify</title>
  <link rel="stylesheet" href="./CSS/dashboard.css">
  <style>
    .loading-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(255,255,255,0.8); display: flex; justify-content: center;
      align-items: center; z-index: 1000;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="loading" class="loading-overlay"><h2>Loading Dashboard...</h2></div>

  <div class="container">
    <div class="navigation">
      <ul>
        <li><a href="#"><span class="icon"><ion-icon name="bulb-outline"></ion-icon></span><span class="title">Tutorify</span></a></li>
        <li><a href="#"><span class="icon"><ion-icon name="home-outline"></ion-icon></span><span class="title">Dashboard</span></a></li>
        <li><a href="#" onclick="logout(event)"><span class="icon"><ion-icon name="log-out-outline"></ion-icon></span><span class="title">Logout</span></a></li>
      </ul>
    </div>

    <div class="main">
      <div class="topbar">
        <div class="toggle"><ion-icon name="menu-outline"></ion-icon></div>
        <div class="user"><img src="./images/digitalmarketing.png" alt="Admin" width="120" height="120"></div>
      </div>

      <div class="cardBox">
        <div class="card">
          <div><div class="numbers" id="stat-views">0</div><div class="cardName">Views</div></div>
          <div class="iconBx"><ion-icon name="eye-outline"></ion-icon></div>
        </div>
        <div class="card">
          <div><div class="numbers" id="stat-courses">0</div><div class="cardName">Courses</div></div>
          <div class="iconBx"><ion-icon name="school-outline"></ion-icon></div>
        </div>
        <div class="card">
          <div><div class="numbers" id="stat-messages">0</div><div class="cardName">Messages</div></div>
          <div class="iconBx"><ion-icon name="chatbubbles-outline"></ion-icon></div>
        </div>
        <div class="card">
          <div><div class="numbers" id="stat-users">0</div><div class="cardName">Users</div></div>
          <div class="iconBx"><ion-icon name="person-outline"></ion-icon></div>
        </div>
      </div>

      <div class="details">
        <div class="recentOrders">
          <div class="cardHeader"><h2>Recent Messages</h2></div>
          <table>
            <thead><tr><td>Name</td><td>Email</td><td>Date</td></tr></thead>
            <tbody id="messages-list"></tbody>
          </table>
        </div>
        <div class="recentCustomers">
          <div class="cardHeader"><h2>Platform Users</h2></div>
          <table id="users-list"></table>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
  <script src="./main.js"></script>
  <script src="./dashboard.js"></script>
</body>
</html>
