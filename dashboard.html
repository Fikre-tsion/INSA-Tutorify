<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <div class="container">
    <div class="navigation">
      <ul>
        <li>
          <a href="#">
            <span class="icon"><ion-icon name="bulb-outline"></ion-icon></span>
            <span class="title">Tutorify</span>
          </a>
        </li>
        <li>
          <a href="index.html">
            <span class="icon"><ion-icon name="home-outline"></ion-icon></span>
            <span class="title">Home</span>
          </a>
        </li>
        <li>
          <a href="#">
            <span class="icon"><ion-icon name="person-outline"></ion-icon></span>
            <span class="title">Users</span>
          </a>
        </li>
        <li>
          <a href="#">
            <span class="icon"><ion-icon name="chatbubbles-outline"></ion-icon></span>
            <span class="title">Message</span>
          </a>
        </li>
        <li>
          <a href="#">
            <span class="icon"><ion-icon name="help-outline"></ion-icon></span>
            <span class="title">Help</span>
          </a>
        </li>
        <li>
          <a href="#">
            <span class="icon"><ion-icon name="settings-outline"></ion-icon></span>
            <span class="title">Settings</span>
          </a>
        </li>
        <li>
          <a href="#">
            <span class="icon"><ion-icon name="lock-closed-outline"></ion-icon></span>
            <span class="title">Password</span>
          </a>
        </li>
        <li>
          <a href="#" onclick="logout()">
            <span class="icon"><ion-icon name="log-out-outline"></ion-icon></span>
            <span class="title">Logout</span>
          </a>
        </li>
      </ul>
    </div>

    <div class="main">
      <div class="topbar">
        <div class="toggle">
          <ion-icon name="menu-outline"></ion-icon>
        </div>
        <div class="search">
          <label>
            <input type="text" placeholder="Search here">
            <ion-icon name="search-outline"></ion-icon>
          </label>
        </div>
        <div class="user">
          <img src="./images2/image.png" alt="User Profile" width="120" height="120" loading="lazy">
        </div>
      </div>

      <!-- Cards -->
      <div class="cardBox">
        <div class="card">
          <div>
            <div class="numbers" id="stat-profile-views">0</div>
            <div class="cardName">Profile Views</div>
          </div>
          <div class="iconBx">
            <ion-icon name="eye-outline"></ion-icon>
          </div>
        </div>
        <div class="card">
          <div>
            <div class="numbers" id="stat-tutorials">0</div>
            <div class="cardName">Tutorials</div>
          </div>
          <div class="iconBx">
            <ion-icon name="school-outline"></ion-icon>
          </div>
        </div>
        <div class="card">
          <div>
            <div class="numbers" id="stat-comments">0</div>
            <div class="cardName">Comments</div>
          </div>
          <div class="iconBx">
            <ion-icon name="chatbubbles-outline"></ion-icon>
          </div>
        </div>
        <div class="card">
          <div>
            <div class="numbers" id="stat-earnings">0</div>
            <div class="cardName">Earnings</div>
          </div>
          <div class="iconBx">
            <ion-icon name="cash-outline"></ion-icon>
          </div>
        </div>
      </div>

      <!-- details lists -->
        <div class="details">
          <div class="recentOrders">
            <div class="cardHeader">
              <h2>Recent Tutors</h2>
              <a href="#" class="btn">View All</a>
            </div>
            <table>
              <thead>
                <tr>
                  <td>Tutor</td>
                  <td>Course</td>
                  <td>Payment</td>
                  <td>Status</td>
                </tr>
              </thead>
              <tbody id="tutors-table-body">
                <!-- Tutors will be loaded here -->
              </tbody>
            </table>
          </div>

          <!-- New Customers -->
           <div class="recentCustomers">
            <div class="cardHeader">
              <h2>Recent Customers</h2>
            </div>
            <table id="customers-table">
              <!-- Customers will be loaded here -->
            </table>
           </div>
        </div>
    </div>
  </div>

  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>

  <script>
    // Check authentication
    const token = localStorage.getItem('token');
    const user = JSON.parse(localStorage.getItem('user'));

    if (!token || !user || user.role !== 'admin') {
      alert('Access denied. Please login as admin.');
      window.location.href = 'login.html';
    }

    function logout() {
      localStorage.removeItem('token');
      localStorage.removeItem('user');
      window.location.href = 'login.html';
    }

    let toggle = document.querySelector('.toggle');
    let navigation = document.querySelector('.navigation');
    let main = document.querySelector('.main');

    toggle.onclick = function() {
      navigation.classList.toggle('active');
      main.classList.toggle('active');
    }

    document.querySelectorAll('.navigation ul li').forEach(li => {
      li.addEventListener('click', () => {
        document.querySelectorAll('.navigation ul li').forEach(x => x.classList.remove('hovered'));
        li.classList.add('hovered');
      });
    });

    // Fetch stats
    async function loadStats() {
      try {
        const response = await fetch('/api/admin/stats', {
          headers: { 'Authorization': `Bearer ${token}` }
        });

        if (!response.ok) throw new Error('Failed to fetch stats');

        const stats = await response.json();

        document.getElementById('stat-profile-views').textContent = stats.profileViews;
        document.getElementById('stat-tutorials').textContent = stats.tutorials;
        document.getElementById('stat-comments').textContent = stats.comments;
        document.getElementById('stat-earnings').textContent = stats.earnings;

        const tutorsBody = document.getElementById('tutors-table-body');
        tutorsBody.innerHTML = '';
        stats.recentTutors.forEach(tutor => {
          const tr = document.createElement('tr');

          const tdName = document.createElement('td');
          tdName.textContent = tutor.name;

          const tdCourse = document.createElement('td');
          tdCourse.textContent = tutor.course;

          const tdPayment = document.createElement('td');
          tdPayment.textContent = tutor.payment;

          const tdStatus = document.createElement('td');
          const span = document.createElement('span');
          span.className = `status ${tutor.status}`;
          span.textContent = tutor.status.charAt(0).toUpperCase() + tutor.status.slice(1);
          tdStatus.appendChild(span);

          tr.appendChild(tdName);
          tr.appendChild(tdCourse);
          tr.appendChild(tdPayment);
          tr.appendChild(tdStatus);
          tutorsBody.appendChild(tr);
        });

        const customersTable = document.getElementById('customers-table');
        customersTable.innerHTML = '';
        stats.recentCustomers.forEach(customer => {
          const tr = document.createElement('tr');

          const tdImg = document.createElement('td');
          tdImg.width = '60px';
          const imgBx = document.createElement('div');
          imgBx.className = 'imgBx';
          const img = document.createElement('img');
          img.src = customer.image;
          img.alt = customer.name;
          img.loading = 'lazy';
          imgBx.appendChild(img);
          tdImg.appendChild(imgBx);

          const tdInfo = document.createElement('td');
          const h4 = document.createElement('h4');
          h4.textContent = customer.name;
          const br = document.createElement('br');
          const span = document.createElement('span');
          span.textContent = customer.grade;
          h4.appendChild(br);
          h4.appendChild(span);
          tdInfo.appendChild(h4);

          tr.appendChild(tdImg);
          tr.appendChild(tdInfo);
          customersTable.appendChild(tr);
        });

      } catch (error) {
        console.error('Error loading stats:', error);
      }
    }

    loadStats();
  </script>
</body>
</html>
