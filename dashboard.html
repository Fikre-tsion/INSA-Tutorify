<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tutorify - Admin Dashboard</title>
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <div class="container">
    <div class="navigation">
      <ul>
        <li>
          <a href="#">
            <span class="icon"><ion-icon name="bulb-outline"></ion-icon></span>
            <span class="title">Tutorify</span>
          </a>
        </li>
        <li>
          <a href="#">
            <span class="icon"><ion-icon name="home-outline"></ion-icon></span>
            <span class="title">Dashboard</span>
          </a>
        </li>
        <li>
          <a href="#">
            <span class="icon"><ion-icon name="person-outline"></ion-icon></span>
            <span class="title">Users</span>
          </a>
        </li>
        <li>
          <a href="#">
            <span class="icon"><ion-icon name="chatbubbles-outline"></ion-icon></span>
            <span class="title">Messages</span>
          </a>
        </li>
        <li>
          <a href="#" onclick="logout(); return false;">
            <span class="icon"><ion-icon name="log-out-outline"></ion-icon></span>
            <span class="title">Logout</span>
          </a>
        </li>
      </ul>
    </div>

    <div class="main">
      <div class="topbar">
        <div class="toggle" aria-label="Toggle navigation menu">
          <ion-icon name="menu-outline"></ion-icon>
        </div>
        <div class="search">
          <label>
            <input type="text" placeholder="Search here">
            <ion-icon name="search-outline"></ion-icon>
          </label>
        </div>
        <div class="user">
          <img src="./digitalmarketing.png" alt="User Profile" width="120" height="120" onerror="this.onerror=null;this.src='./digitalmarketing.png';">
        </div>
      </div>

      <!-- Cards -->
      <div class="cardBox">
        <div class="card">
          <div>
            <div class="numbers" id="stat-views">0</div>
            <div class="cardName">Profile Views</div>
          </div>
          <div class="iconBx">
            <ion-icon name="eye-outline"></ion-icon>
          </div>
        </div>
        <div class="card">
          <div>
            <div class="numbers" id="stat-courses">0</div>
            <div class="cardName">Courses</div>
          </div>
          <div class="iconBx">
            <ion-icon name="school-outline"></ion-icon>
          </div>
        </div>
        <div class="card">
          <div>
            <div class="numbers" id="stat-messages">0</div>
            <div class="cardName">Messages</div>
          </div>
          <div class="iconBx">
            <ion-icon name="chatbubbles-outline"></ion-icon>
          </div>
        </div>
        <div class="card">
          <div>
            <div class="numbers" id="stat-users">0</div>
            <div class="cardName">Registered Users</div>
          </div>
          <div class="iconBx">
            <ion-icon name="people-outline"></ion-icon>
          </div>
        </div>
      </div>

      <!-- details lists -->
      <div class="details">
        <div class="recentOrders">
          <div class="cardHeader">
            <h2>Recent Messages</h2>
          </div>
          <div class="table-responsive">
            <table id="messagesTable">
              <thead>
                <tr>
                  <td>Sender</td>
                  <td>Message</td>
                  <td>Date</td>
                  <td>Status</td>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td colspan="4">Loading messages...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

        <!-- Registered Users -->
        <div class="recentCustomers">
          <div class="cardHeader">
            <h2>Registered Users</h2>
          </div>
          <div class="table-responsive">
            <table id="usersTable">
              <thead>
                <tr>
                  <td>User</td>
                  <td>Role</td>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td colspan="2">Loading users...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>

  <script>
    // Authentication guard with null checks
    const token = localStorage.getItem('token');
    const userJson = localStorage.getItem('user');
    let user = null;

    if (userJson) {
      try { user = JSON.parse(userJson); } catch(e){}
    }

    if (!token || !user || (user && user.role !== 'admin')) {
      alert('Access denied. Please login as admin.');
      window.location.href = 'login.html';
    }

    function logout() {
      localStorage.removeItem('token');
      localStorage.removeItem('user');
      window.location.href = 'login.html';
    }
  </script>
  <script src="dashboard.js"></script>
</body>
</html>
