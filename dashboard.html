<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Tutorify</title>
  <link rel="stylesheet" href="./CSS/dashboard.css">
</head>
<body>
  <div class="container">
    <div class="navigation">
      <ul>
        <li>
          <a href="index.html">
            <span class="icon"><ion-icon name="bulb-outline"></ion-icon></span>
            <span class="title">Tutorify</span>
          </a>
        </li>
        <li>
          <a href="#">
            <span class="icon"><ion-icon name="home-outline"></ion-icon></span>
            <span class="title">Dashboard</span>
          </a>
        </li>
        <li>
          <a href="#">
            <span class="icon"><ion-icon name="person-outline"></ion-icon></span>
            <span class="title">Users</span>
          </a>
        </li>
        <li>
          <a href="#">
            <span class="icon"><ion-icon name="chatbubbles-outline"></ion-icon></span>
            <span class="title">Message</span>
          </a>
        </li>
        <li>
          <a href="#" onclick="logout()">
            <span class="icon"><ion-icon name="log-out-outline"></ion-icon></span>
            <span class="title">Logout</span>
          </a>
        </li>
      </ul>
    </div>

    <div class="main">
      <div class="topbar">
        <div class="toggle" aria-label="Toggle navigation drawer" role="button" tabindex="0">
          <ion-icon name="menu-outline"></ion-icon>
        </div>
        <div class="search">
          <label>
            <input type="text" placeholder="Search here" aria-label="Search">
            <ion-icon name="search-outline"></ion-icon>
          </label>
        </div>
        <div class="user">
          <img src="./digitalmarketing.png" alt="User Profile" width="60" height="60">
        </div>
      </div>

      <div id="stats-loader" style="padding: 20px; text-align: center; font-weight: bold; color: #2876ff;">
        Loading dashboard statistics...
      </div>

      <!-- Cards Container -->
      <div class="cardBox" id="stats-container">
        <!-- Rendered dynamically via dashboard.js -->
      </div>

      <!-- Details Lists -->
      <div class="details">
        <div class="recentOrders">
          <div class="cardHeader">
            <h2>Recent Tutors</h2>
            <a href="#" class="btn">View All</a>
          </div>
          <div class="table-responsive">
            <table id="tutors-table">
              <thead>
                <tr>
                  <td>Tutor</td>
                  <td>Course</td>
                  <td>Payment</td>
                  <td>Status</td>
                </tr>
              </thead>
              <tbody>
                <!-- Rendered dynamically via dashboard.js -->
              </tbody>
            </table>
          </div>
        </div>

        <!-- Recent Customers -->
        <div class="recentCustomers">
          <div class="cardHeader">
            <h2>Recent Customers</h2>
          </div>
          <div class="table-responsive">
            <table id="customers-table">
              <!-- Rendered dynamically via dashboard.js -->
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>

  <script src="./dashboard.js"></script>
</body>
</html>
