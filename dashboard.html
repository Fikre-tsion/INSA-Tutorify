<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tutorify Admin Dashboard</title>
  <link rel="stylesheet" href="dashboard.css">
  <style>
    .table-responsive {
      overflow-x: auto;
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="navigation">
      <ul>
        <li>
          <a href="#">
            <span class="icon"><ion-icon name="bulb-outline"></ion-icon></span>
            <span class="title">Tutorify</span>
          </a>
        </li>
        <li>
          <a href="#">
            <span class="icon"><ion-icon name="home-outline"></ion-icon></span>
            <span class="title">Dashboard</span>
          </a>
        </li>
        <li>
          <a href="#">
            <span class="icon"><ion-icon name="person-outline"></ion-icon></span>
            <span class="title">Users</span>
          </a>
        </li>
        <li>
          <a href="#">
            <span class="icon"><ion-icon name="chatbubbles-outline"></ion-icon></span>
            <span class="title">Message</span>
          </a>
        </li>
        <li>
          <a href="#">
            <span class="icon"><ion-icon name="help-outline"></ion-icon></span>
            <span class="title">Help</span>
          </a>
        </li>
        <li>
          <a href="#">
            <span class="icon"><ion-icon name="settings-outline"></ion-icon></span>
            <span class="title">Settings</span>
          </a>
        </li>
        <li>
          <a href="#">
            <span class="icon"><ion-icon name="lock-closed-outline"></ion-icon></span>
            <span class="title">Password</span>
          </a>
        </li>
        <li>
          <a href="#" onclick="logout()">
            <span class="icon"><ion-icon name="log-out-outline"></ion-icon></span>
            <span class="title">Logout</span>
          </a>
        </li>
      </ul>
    </div>

    <div class="main">
      <div class="topbar">
        <div class="toggle" aria-label="Toggle Navigation" role="button" tabindex="0">
          <ion-icon name="menu-outline"></ion-icon>
        </div>
        <div class="search">
          <label>
            <input type="text" placeholder="Search here" aria-label="Search Dashboard">
            <ion-icon name="search-outline"></ion-icon>
          </label>
        </div>
        <div class="user">
          <img src="./digitalmarketing.png" alt="User Profile" width="120" height="120" onerror="this.src='./digitalmarketing.png'">
        </div>
      </div>

      <!-- Stat Cards -->
      <div class="cardBox">
        <div class="card">
          <div>
            <div class="numbers">0</div>
            <div class="cardName">Profile Views</div>
          </div>
          <div class="iconBx">
            <ion-icon name="eye-outline"></ion-icon>
          </div>
        </div>
        <div class="card">
          <div>
            <div class="numbers">0</div>
            <div class="cardName">Tutorials</div>
          </div>
          <div class="iconBx">
            <ion-icon name="school-outline"></ion-icon>
          </div>
        </div>
        <div class="card">
          <div>
            <div class="numbers">0</div>
            <div class="cardName">Comments</div>
          </div>
          <div class="iconBx">
            <ion-icon name="chatbubbles-outline"></ion-icon>
          </div>
        </div>
        <div class="card">
          <div>
            <div class="numbers">ETB 0</div>
            <div class="cardName">Earnings</div>
          </div>
          <div class="iconBx">
            <ion-icon name="cash-outline"></ion-icon>
          </div>
        </div>
      </div>

      <!-- Details Lists -->
      <div class="details">
        <div class="recentOrders">
          <div class="cardHeader">
            <h2>Recent Messages</h2>
            <a href="#" class="btn">View All</a>
          </div>
          <div class="table-responsive">
            <table>
              <thead>
                <tr>
                  <td>Sender</td>
                  <td>Message</td>
                  <td>Date</td>
                  <td>Status</td>
                </tr>
              </thead>
              <tbody>
                <!-- Dynamically populated via dashboard.js -->
              </tbody>
            </table>
          </div>
        </div>

        <!-- Recent Customers / Students -->
        <div class="recentCustomers">
          <div class="cardHeader">
            <h2>Recent Students</h2>
          </div>
          <table>
            <tbody>
              <tr>
                <td width="60px">
                  <div class="imgBx"><img src="./digitalmarketing.png" alt="Gebre" onerror="this.src='./digitalmarketing.png'"></div>
                </td>
                <td>
                  <h4>Gebre<br><span>Grade 12</span></h4>
                </td>
              </tr>
              <tr>
                <td width="60px">
                  <div class="imgBx"><img src="./digitalmarketing.png" alt="Selam" onerror="this.src='./digitalmarketing.png'"></div>
                </td>
                <td>
                  <h4>Selam<br><span>Grade 11</span></h4>
                </td>
              </tr>
              <tr>
                <td width="60px">
                  <div class="imgBx"><img src="./digitalmarketing.png" alt="Yonas" onerror="this.src='./digitalmarketing.png'"></div>
                </td>
                <td>
                  <h4>Yonas<br><span>Grade 10</span></h4>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>

  <script>
    // Null-guarded Authentication Check
    const token = localStorage.getItem('token');
    const user = JSON.parse(localStorage.getItem('user'));

    if (!token || !user || (user && user.role !== 'admin')) {
      alert('Access denied. Please login as admin.');
      window.location.href = 'login.html';
    }

    function logout() {
      localStorage.removeItem('token');
      localStorage.removeItem('user');
      window.location.href = 'login.html';
    }

    let toggle = document.querySelector('.toggle');
    let navigation = document.querySelector('.navigation');
    let main = document.querySelector('.main');

    if (toggle && navigation && main) {
      toggle.onclick = function() {
        navigation.classList.toggle('active');
        main.classList.toggle('active');
      }
    }

    document.querySelectorAll('.navigation ul li').forEach(li => {
      li.addEventListener('click', () => {
        document.querySelectorAll('.navigation ul li').forEach(x => x.classList.remove('hovered'));
        li.classList.add('hovered');
      });
    });
  </script>
  <script src="./dashboard.js"></script>
</body>
</html>
