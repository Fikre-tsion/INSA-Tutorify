<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <div class="container">
    <div class="navigation">
      <ul>
        <li>
          <a href="#">
            <span class="icon"><ion-icon name="bulb-outline"></ion-icon></span>
            <span class="title">Tutorify</span>
          </a>
        </li>
        <li>
          <a href="#">
            <span class="icon"><ion-icon name="home-outline"></ion-icon></span>
            <span class="title">Dashboard</span>
          </a>
        </li>
        <li>
          <a href="#">
            <span class="icon"><ion-icon name="person-outline"></ion-icon></span>
            <span class="title">Users</span>
          </a>
        </li>
        <li>
          <a href="#">
            <span class="icon"><ion-icon name="chatbubbles-outline"></ion-icon></span>
            <span class="title">Message</span>
          </a>
        </li>
        <li>
          <a href="#">
            <span class="icon"><ion-icon name="help-outline"></ion-icon></span>
            <span class="title">Help</span>
          </a>
        </li>
        <li>
          <a href="#">
            <span class="icon"><ion-icon name="settings-outline"></ion-icon></span>
            <span class="title">Settings</span>
          </a>
        </li>
        <li>
          <a href="#">
            <span class="icon"><ion-icon name="lock-closed-outline"></ion-icon></span>
            <span class="title">Password</span>
          </a>
        </li>
        <li>
          <a href="#" onclick="logout()">
            <span class="icon"><ion-icon name="log-out-outline"></ion-icon></span>
            <span class="title">Logout</span>
          </a>
        </li>
      </ul>
    </div>

    <div class="main">
      <div class="topbar">
        <div class="toggle" aria-label="Toggle Navigation">
          <ion-icon name="menu-outline"></ion-icon>
        </div>
        <div class="search">
          <label>
            <input type="text" placeholder="Search here">
            <ion-icon name="search-outline"></ion-icon>
          </label>
        </div>
        <div class="user">
          <img src="./images2/image.png" alt="User Profile" width="120" height="120">
        </div>
      </div>

      <!-- Cards -->
      <div class="cardBox" id="stats-cards">
        <div class="card">
          <div>
            <div class="numbers" id="stat-views">...</div>
            <div class="cardName">Profile Views</div>
          </div>
          <div class="iconBx">
            <ion-icon name="eye-outline"></ion-icon>
          </div>
        </div>
        <div class="card">
          <div>
            <div class="numbers" id="stat-tutorials">...</div>
            <div class="cardName">Tutorials</div>
          </div>
          <div class="iconBx">
            <ion-icon name="school-outline"></ion-icon>
          </div>
        </div>
        <div class="card">
          <div>
            <div class="numbers" id="stat-comments">...</div>
            <div class="cardName">Comments</div>
          </div>
          <div class="iconBx">
            <ion-icon name="chatbubbles-outline"></ion-icon>
          </div>
        </div>
        <div class="card">
          <div>
            <div class="numbers" id="stat-earnings">...</div>
            <div class="cardName">Earnings</div>
          </div>
          <div class="iconBx">
            <ion-icon name="cash-outline"></ion-icon>
          </div>
        </div>
      </div>

      <!-- details lists -->
        <div class="details">
          <div class="recentOrders">
            <div class="cardHeader">
              <h2>Recent Tutors</h2>
              <a href="#" class="btn">View All</a>
            </div>
            <table>
              <thead>
                <tr>
                  <td>Tutor</td>
                  <td>Course</td>
                  <td>Payment</td>
                  <td>Status</td>
                </tr>
              </thead>
              <tbody id="tutors-table-body">
                <!-- Loaded from API -->
              </tbody>
            </table>
          </div>

          <!-- New Customers -->
           <div class="recentCustomers">
            <div class="cardHeader">
              <h2>Recent Customers</h2>
            </div>
            <table id="customers-table">
              <!-- Loaded from API -->
            </table>
           </div>

        </div>
    </div>
  </div>

  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>

  <script>
    // Check authentication
    const token = localStorage.getItem('token');
    const user = JSON.parse(localStorage.getItem('user'));

    if (!token || !user || user.role !== 'admin') {
      alert('Access denied. Please login as admin.');
      window.location.href = 'login.html';
    }

    function logout() {
      localStorage.removeItem('token');
      localStorage.removeItem('user');
      window.location.href = 'login.html';
    }

    let toggle = document.querySelector('.toggle');
    let navigation = document.querySelector('.navigation');
    let main = document.querySelector('.main');

    toggle.onclick = function() {
      navigation.classList.toggle('active');
      main.classList.toggle('active');
    }

    // Fetch and display admin data
    async function fetchAdminData() {
      try {
        const response = await fetch('/api/admin/stats', {
          headers: {
            'Authorization': `Bearer ${token}`
          }
        });

        if (response.ok) {
          const data = await response.json();

          // Update stats
          document.getElementById('stat-views').innerText = data.stats.views.toLocaleString();
          document.getElementById('stat-tutorials').innerText = data.stats.tutorials;
          document.getElementById('stat-comments').innerText = data.stats.comments;
          document.getElementById('stat-earnings').innerText = `ETB ${data.stats.earnings.toLocaleString()}`;

          // Update tutors
          const tutorsBody = document.getElementById('tutors-table-body');
          tutorsBody.innerHTML = data.tutors.map(tutor => `
            <tr>
              <td>${tutor.name}</td>
              <td>${tutor.course}</td>
              <td>${tutor.payment}</td>
              <td><span class="status ${tutor.status}">${tutor.status.charAt(0).toUpperCase() + tutor.status.slice(1)}</span></td>
            </tr>
          `).join('');

          // Update customers
          const customersTable = document.getElementById('customers-table');
          customersTable.innerHTML = data.customers.map(customer => `
            <tr>
              <td width="60px">
                <div class="imgBx"><img src="${customer.image}" alt="${customer.name}" loading="lazy"></div>
              </td>
              <td>
                <h4>${customer.name}<br><span>${customer.grade}</span></h4>
              </td>
            </tr>
          `).join('');

        } else {
          console.error('Failed to fetch admin data');
        }
      } catch (error) {
        console.error('Error:', error);
      }
    }

    fetchAdminData();

    document.querySelectorAll('.navigation ul li').forEach(li => {
      li.addEventListener('click', () => {
        document.querySelectorAll('.navigation ul li').forEach(x => x.classList.remove('hovered'));
        li.classList.add('hovered');
      });
    });
  </script>
</body>
</html>
