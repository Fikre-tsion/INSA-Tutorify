<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <div class="container">
    <div class="navigation">
      <ul>
        <li>
          <a href="#">
            <span class="icon"><ion-icon name="bulb-outline"></ion-icon></span>
            <span class="title">Tutorify</span>
          </a>
        </li>
        <li>
          <a href="#">
            <span class="icon"><ion-icon name="home-outline"></ion-icon></span>
            <span class="title">Dashboard</span>
          </a>
        </li>
        <li>
          <a href="#">
            <span class="icon"><ion-icon name="person-outline"></ion-icon></span>
            <span class="title">Users</span>
          </a>
        </li>
        <li>
          <a href="#">
            <span class="icon"><ion-icon name="chatbubbles-outline"></ion-icon></span>
            <span class="title">Message</span>
          </a>
        </li>
        <li>
          <a href="#">
            <span class="icon"><ion-icon name="help-outline"></ion-icon></span>
            <span class="title">Help</span>
          </a>
        </li>
        <li>
          <a href="#">
            <span class="icon"><ion-icon name="settings-outline"></ion-icon></span>
            <span class="title">Settings</span>
          </a>
        </li>
        <li>
          <a href="#">
            <span class="icon"><ion-icon name="lock-closed-outline"></ion-icon></span>
            <span class="title">Password</span>
          </a>
        </li>
        <li>
          <a href="#" onclick="logout()">
            <span class="icon"><ion-icon name="log-out-outline"></ion-icon></span>
            <span class="title">Logout</span>
          </a>
        </li>
      </ul>
    </div>

    <div class="main">
      <div class="topbar">
        <div class="toggle">
          <ion-icon name="menu-outline"></ion-icon>
        </div>
        <div class="search">
          <label>
            <input type="text" placeholder="Search here">
            <ion-icon name="search-outline"></ion-icon>
          </label>
        </div>
        <div class="user">
          <img src="./images2/image.png" alt="User Profile" width="120" height="120">
        </div>
      </div>

      <!-- Cards -->
      <div class="cardBox" id="cardBox">
        <!-- Dynamic content -->
      </div>

      <!-- details lists -->
        <div class="details">
          <div class="recentOrders">
            <div class="cardHeader">
              <h2>Recent Tutors</h2>
              <a href="#" class="btn">View All</a>
            </div>
            <table id="tutorsTable">
              <thead>
                <tr>
                  <td>Tutor</td>
                  <td>Course</td>
                  <td>Payment</td>
                  <td>Status</td>
                </tr>
              </thead>
              <tbody>
                <!-- Dynamic content -->
              </tbody>
            </table>
          </div>

          <!-- New Customers -->
           <div class="recentCustomers">
            <div class="cardHeader">
              <h2>Recent Customers</h2>
            </div>
            <table id="customersTable">
               <!-- Dynamic content -->
            </table>
           </div>

        </div>
    </div>
  </div>

  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>

  <script>
    // Check authentication
    const token = localStorage.getItem('token');
    const user = JSON.parse(localStorage.getItem('user'));

    if (!token || !user || user.role !== 'admin') {
      alert('Access denied. Please login as admin.');
      window.location.href = 'login.html';
    }

    async function fetchStats() {
      try {
        const response = await fetch('/api/admin/stats', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (!response.ok) throw new Error('Failed to fetch stats');
        const data = await response.json();

        displayStats(data);
      } catch (error) {
        console.error('Error:', error);
      }
    }

    function displayStats(data) {
      const cardBox = document.getElementById('cardBox');
      const stats = data.stats;
      cardBox.innerHTML = `
        <div class="card">
          <div>
            <div class="numbers">${stats.profileViews}</div>
            <div class="cardName">Profile Views</div>
          </div>
          <div class="iconBx"><ion-icon name="eye-outline"></ion-icon></div>
        </div>
        <div class="card">
          <div>
            <div class="numbers">${stats.tutorials}</div>
            <div class="cardName">Tutorials</div>
          </div>
          <div class="iconBx"><ion-icon name="school-outline"></ion-icon></div>
        </div>
        <div class="card">
          <div>
            <div class="numbers">${stats.comments}</div>
            <div class="cardName">Comments</div>
          </div>
          <div class="iconBx"><ion-icon name="chatbubbles-outline"></ion-icon></div>
        </div>
        <div class="card">
          <div>
            <div class="numbers">${stats.earnings}</div>
            <div class="cardName">Earnings</div>
          </div>
          <div class="iconBx"><ion-icon name="cash-outline"></ion-icon></div>
        </div>
      `;

      const tutorsTable = document.querySelector('#tutorsTable tbody');
      tutorsTable.innerHTML = data.tutors.map(t => `
        <tr>
          <td>${t.name}</td>
          <td>${t.course}</td>
          <td>${t.payment}</td>
          <td><span class="status ${t.status}">${t.status.charAt(0).toUpperCase() + t.status.slice(1)}</span></td>
        </tr>
      `).join('');

      const customersTable = document.getElementById('customersTable');
      customersTable.innerHTML = data.customers.map(c => `
        <tr>
          <td width="60px">
            <div class="imgBx"><img src="${c.image}" alt="Customer"></div>
          </td>
          <td>
            <h4>${c.name}<br><span>${c.grade}</span></h4>
          </td>
        </tr>
      `).join('');
    }

    window.onload = fetchStats;

    function logout() {
      localStorage.removeItem('token');
      localStorage.removeItem('user');
      window.location.href = 'login.html';
    }

    let toggle = document.querySelector('.toggle');
    let navigation = document.querySelector('.navigation');
    let main = document.querySelector('.main');

    toggle.onclick = function() {
      navigation.classList.toggle('active');
      main.classList.toggle('active');
    }
  </script>
  <script>
    document.querySelectorAll('.navigation ul li').forEach(li => {
      li.addEventListener('click', () => {
        document.querySelectorAll('.navigation ul li').forEach(x => x.classList.remove('hovered'));
        li.classList.add('hovered');
      });
    });
  </script>
</body>
</html>
