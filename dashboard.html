<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Tutorify</title>
  <link rel="stylesheet" href="dashboard.css">
  <style>
    .recentCustomers td h4 span {
      display: inline-block;
      max-width: 140px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      vertical-align: bottom;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="navigation">
      <ul>
        <li>
          <a href="#">
            <span class="icon"><ion-icon name="bulb-outline"></ion-icon></span>
            <span class="title">Tutorify</span>
          </a>
        </li>
        <li>
          <a href="#">
            <span class="icon"><ion-icon name="home-outline"></ion-icon></span>
            <span class="title">Dashboard</span>
          </a>
        </li>
        <li>
          <a href="#">
            <span class="icon"><ion-icon name="person-outline"></ion-icon></span>
            <span class="title">Users</span>
          </a>
        </li>
        <li>
          <a href="#">
            <span class="icon"><ion-icon name="chatbubbles-outline"></ion-icon></span>
            <span class="title">Messages</span>
          </a>
        </li>
        <li>
          <a href="#" onclick="logout()">
            <span class="icon"><ion-icon name="log-out-outline"></ion-icon></span>
            <span class="title">Logout</span>
          </a>
        </li>
      </ul>
    </div>

    <div class="main">
      <div class="topbar">
        <div class="toggle" tabindex="0" role="button" aria-label="Toggle navigation menu">
          <ion-icon name="menu-outline"></ion-icon>
        </div>
        <div class="search">
          <label>
            <input type="text" placeholder="Search here" aria-label="Search dashboard">
            <ion-icon name="search-outline"></ion-icon>
          </label>
        </div>
        <div class="user">
          <img src="./digitalmarketing.png" alt="User Profile" width="120" height="120">
        </div>
      </div>

      <!-- Cards -->
      <div class="cardBox">
        <div class="card">
          <div>
            <div class="numbers">0</div>
            <div class="cardName">Profile Views</div>
          </div>
          <div class="iconBx">
            <ion-icon name="eye-outline"></ion-icon>
          </div>
        </div>
        <div class="card">
          <div>
            <div class="numbers">0</div>
            <div class="cardName">Courses</div>
          </div>
          <div class="iconBx">
            <ion-icon name="school-outline"></ion-icon>
          </div>
        </div>
        <div class="card">
          <div>
            <div class="numbers">0</div>
            <div class="cardName">Messages</div>
          </div>
          <div class="iconBx">
            <ion-icon name="chatbubbles-outline"></ion-icon>
          </div>
        </div>
        <div class="card">
          <div>
            <div class="numbers">0</div>
            <div class="cardName">Users</div>
          </div>
          <div class="iconBx">
            <ion-icon name="person-outline"></ion-icon>
          </div>
        </div>
      </div>

      <!-- details lists -->
      <div class="details">
        <div class="recentOrders table-responsive">
          <div class="cardHeader">
            <h2>Recent Messages</h2>
          </div>
          <table>
            <thead>
              <tr>
                <td>Sender</td>
                <td>Message</td>
                <td>Date</td>
                <td>Status</td>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td colspan="4">Loading messages...</td>
              </tr>
            </tbody>
          </table>
        </div>

        <!-- Recent Customers -->
        <div class="recentCustomers">
          <div class="cardHeader">
            <h2>Recent Users</h2>
          </div>
          <table>
            <tr>
              <td>Loading users...</td>
            </tr>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
  <script src="./dashboard.js"></script>
</body>
</html>
