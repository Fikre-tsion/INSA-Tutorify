<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <div class="container">
    <div class="navigation">
      <ul>
        <li>
          <a href="#">
            <span class="icon"><ion-icon name="bulb-outline"></ion-icon></span>
            <span class="title">Tutorify</span>
          </a>
        </li>
        <li>
          <a href="#">
            <span class="icon"><ion-icon name="home-outline"></ion-icon></span>
            <span class="title">Dashboard</span>
          </a>
        </li>
        <li>
          <a href="#">
            <span class="icon"><ion-icon name="person-outline"></ion-icon></span>
            <span class="title">Users</span>
          </a>
        </li>
        <li>
          <a href="#">
            <span class="icon"><ion-icon name="chatbubbles-outline"></ion-icon></span>
            <span class="title">Message</span>
          </a>
        </li>
        <li>
          <a href="#">
            <span class="icon"><ion-icon name="help-outline"></ion-icon></span>
            <span class="title">Help</span>
          </a>
        </li>
        <li>
          <a href="#">
            <span class="icon"><ion-icon name="settings-outline"></ion-icon></span>
            <span class="title">Settings</span>
          </a>
        </li>
        <li>
          <a href="#">
            <span class="icon"><ion-icon name="lock-closed-outline"></ion-icon></span>
            <span class="title">Password</span>
          </a>
        </li>
        <li>
          <a href="#" onclick="logout()">
            <span class="icon"><ion-icon name="log-out-outline"></ion-icon></span>
            <span class="title">Logout</span>
          </a>
        </li>
      </ul>
    </div>

    <div class="main">
      <div class="topbar">
        <button class="toggle" aria-label="Toggle navigation menu" style="background: transparent; border: none; cursor: pointer;">
          <ion-icon name="menu-outline"></ion-icon>
        </button>
        <div class="search">
          <label>
            <input type="text" placeholder="Search here">
            <ion-icon name="search-outline"></ion-icon>
          </label>
        </div>
        <div class="user">
          <img src="./images2/image.png" alt="User Profile" width="120" height="120">
        </div>
      </div>

      <!-- Cards -->
      <div class="cardBox">
        <div class="card">
          <div>
            <div class="numbers" id="stat-views">0</div>
            <div class="cardName">Profile Views</div>
          </div>
          <div class="iconBx">
            <ion-icon name="eye-outline"></ion-icon>
          </div>
        </div>
        <div class="card">
          <div>
            <div class="numbers" id="stat-courses">0</div>
            <div class="cardName">Active Courses</div>
          </div>
          <div class="iconBx">
            <ion-icon name="school-outline"></ion-icon>
          </div>
        </div>
        <div class="card">
          <div>
            <div class="numbers" id="stat-messages">0</div>
            <div class="cardName">Messages</div>
          </div>
          <div class="iconBx">
            <ion-icon name="chatbubbles-outline"></ion-icon>
          </div>
        </div>
        <div class="card">
          <div>
            <div class="numbers" id="stat-users">0</div>
            <div class="cardName">Registered Users</div>
          </div>
          <div class="iconBx">
            <ion-icon name="people-outline"></ion-icon>
          </div>
        </div>
      </div>

      <!-- datails lists -->
        <div class="details">
          <div class="recentOrders">
            <div class="cardHeader">
              <h2>Recent Messages</h2>
            </div>
            <table>
              <thead>
                <tr>
                  <td>Sender</td>
                  <td>Message</td>
                  <td>Date</td>
                  <td>Status</td>
                </tr>
              </thead>

              <tbody>
              </tbody>
            </table>
          </div>

          <!-- New Customers -->
           <div class="recentCustomers">
            <div class="cardHeader">
              <h2>Recent Customers</h2>
            </div>
            <table>
              <tr>
                <td width="60px">
                  <div class="imgBx"><img src="./images2/2.jpg" alt="Customer"></div>
                </td>
                <td>
                  <h4>Gebre<br><span>Grade 12</span></h4>
                </td>
              </tr>

              <tr>
                <td width="60px">
                  <div class="imgBx"><img src="./images2/1.jpg" alt="Customer"></div>
                </td>
                <td>
                  <h4>Selam<br><span>Grade 11</span></h4>
                </td>

                <tr>
                  <td width="60px">
                    <div class="imgBx"><img src="./images2/4.jpg" alt="Customer"></div>
                  </td>
                  <td>
                    <h4>Yonas<br><span>Grade 10</span></h4>
                  </td>
                </tr>

                <tr>
                  <td width="60px">
                    <div class="imgBx"><img src="./images2/student.png" alt="Customer"></div>
                  </td>
                  <td>
                    <h4>Meron<br><span>Grade 9</span></h4>
                  </td>
                </tr>

                <tr>
                  <td width="60px">
                    <div class="imgBx"><img src="./images2/5.jpg" alt="Customer"></div>
                  </td>
                  <td>
                    <h4>Daniel<br><span>Grade 12</span></h4>
                  </td>
                </tr>
              </tr>
            </table>
           </div>

        </div>
    </div>
  </div>

  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>

  <script src="./dashboard.js"></script>
  <script>
    function logout() {
      localStorage.removeItem('token');
      localStorage.removeItem('user');
      window.location.href = 'login.html';
    }

    let toggle = document.querySelector('.toggle');
    let navigation = document.querySelector('.navigation');
    let main = document.querySelector('.main');

    if (toggle) {
      toggle.onclick = function() {
        navigation.classList.toggle('active');
        main.classList.toggle('active');
      }
    }
  </script>
  <script>
    document.querySelectorAll('.navigation ul li').forEach(li => {
      li.addEventListener('click', () => {
        document.querySelectorAll('.navigation ul li').forEach(x => x.classList.remove('hovered'));
        li.classList.add('hovered');
      });
    });
  </script>
</body>
</html>
