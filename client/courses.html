<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Courses - Tutorify</title>
  <link rel="stylesheet" href="https://unicons.iconscout.com/release/v4.0.8/css/line.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav>
    <div class="container nav__container">
      <a href="index.html"><h4>Tutorify</h4></a>
      <ul class="nav__menu">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="courses.html" class="active">Courses</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li id="auth-link"><a href="login.html">Login</a></li>
        <li><button id="theme-toggle"><i class="uil uil-sun"></i></button></li>
      </ul>
    </div>
  </nav>

  <section class="courses" style="padding: 6rem 0;">
    <h2>Our Full Course Catalog</h2>
    <div class="container courses__container" id="all-courses-container">
        <!-- Courses loaded from API -->
    </div>
  </section>

  <footer>
    <div class="container footer__container">
        <div class="footer__1">
            <a href="index.html" class="footer__logo"><h4>Tutorify</h4></a>
            <p>Our mission is to empower individuals with the knowledge and skills.</p>
        </div>
        <div class="footer__2">
            <h4>Permalinks</h4>
            <ul class="permalinks">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="courses.html">Courses</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </div>
        <div class="footer__4">
            <h4>Contact Us</h4>
            <p>+251966418467 / +251928505904</p>
            <p>tutorifytutoring@gmail.com</p>
        </div>
    </div>
  </footer>

  <script src="js/main.js"></script>
  <script>
    async function loadAllCourses() {
        try {
            const courses = await api.fetch('/api/courses');
            const container = document.getElementById('all-courses-container');
            container.innerHTML = courses.map(course => `
                <article class="course">
                    <div class="course__image"><img src="${course.image}" alt="${course.title}"></div>
                    <div class="course__info">
                        <h4>${course.title}</h4>
                        <p>${course.description}</p>
                        <button onclick="enroll(${course.id})" class="btn btn-primary">Enroll Now</button>
                    </div>
                </article>
            `).join('');
        } catch (e) { console.error(e); }
    }

    async function enroll(courseId) {
        try {
            const data = await api.fetch('/api/courses/enroll', {
                method: 'POST',
                body: JSON.stringify({ courseId })
            });
            alert(data.message);
        } catch (e) { alert(e.message); }
    }

    document.addEventListener('DOMContentLoaded', loadAllCourses);
  </script>
</body>
</html>
