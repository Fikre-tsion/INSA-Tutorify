<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Hub - Tutorify</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://unicons.iconscout.com/release/v4.0.8/css/line.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
      .stat-card { border-radius: 1.5rem; transition: 0.3s; }
      .stat-card:hover { transform: scale(1.05); }
      .sidebar { background: var(--color-bg-dark); height: 100vh; position: sticky; top: 0; }
  </style>
</head>
<body>
  <div class="container-fluid">
    <div class="row">
      <nav class="col-md-3 col-lg-2 d-md-block sidebar collapse p-4">
        <h4 class="text-primary fw-bold mb-5">TUTORIFY</h4>
        <ul class="nav flex-column gap-3">
          <li class="nav-item"><a class="nav-link p-0 d-flex align-items-center gap-2" href="index.html"><i class="uil uil-home"></i> Home</a></li>
          <li class="nav-item"><a class="nav-link p-0 active d-flex align-items-center gap-2" href="#"><i class="uil uil-apps"></i> Dashboard</a></li>
          <li class="nav-item"><a class="nav-link p-0 d-flex align-items-center gap-2" href="#"><i class="uil uil-users-alt"></i> Users</a></li>
          <li class="nav-item"><a class="nav-link p-0 d-flex align-items-center gap-2" href="#" onclick="logout()"><i class="uil uil-sign-out-alt"></i> Logout</a></li>
        </ul>
      </nav>

      <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 pt-5">
        <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pb-2 mb-4 border-bottom border-secondary border-opacity-10">
          <h1 class="h2 fw-bold">Admin Hub</h1>
          <div class="d-flex align-items-center gap-3">
              <div id="lang-selector-nav"></div>
              <button id="theme-toggle" class="btn btn-sm glass text-white rounded-circle" style="width: 40px; height: 40px;"><i class="uil uil-sun"></i></button>
          </div>
        </div>

        <div class="row g-4 mb-5">
            <div class="col-md-3">
                <div class="stat-card glass p-4 shadow-sm border-0 border-start border-primary border-5">
                    <h6 class="text-muted small text-uppercase">Total Users</h6>
                    <h2 class="fw-bold m-0" id="stat-users">0</h2>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card glass p-4 shadow-sm border-0 border-start border-success border-5">
                    <h6 class="text-muted small text-uppercase">Courses</h6>
                    <h2 class="fw-bold m-0" id="stat-courses">0</h2>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card glass p-4 shadow-sm border-0 border-start border-warning border-5">
                    <h6 class="text-muted small text-uppercase">Enrollments</h6>
                    <h2 class="fw-bold m-0" id="stat-enrollments">0</h2>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card glass p-4 shadow-sm border-0 border-start border-danger border-5">
                    <h6 class="text-muted small text-uppercase">Messages</h6>
                    <h2 class="fw-bold m-0" id="stat-messages">0</h2>
                </div>
            </div>
        </div>

        <div class="row g-4">
            <div class="col-lg-8">
                <div class="glass-card p-4 h-100 shadow-sm border-0">
                    <h5 class="fw-bold mb-4">Recent Registrations</h5>
                    <div class="table-responsive">
                        <table class="table table-dark table-hover table-borderless align-middle m-0">
                            <thead class="text-muted small text-uppercase">
                                <tr>
                                    <th>Name</th>
                                    <th>Email</th>
                                    <th>Role</th>
                                    <th>Joined</th>
                                </tr>
                            </thead>
                            <tbody id="users-tbody" class="small"></tbody>
                        </table>
                    </div>
                </div>
            </div>
            <div class="col-lg-4">
                <div class="glass-card p-4 h-100 shadow-sm border-0">
                    <h5 class="fw-bold mb-4">Live Activity</h5>
                    <div id="messages-table" class="small d-flex flex-column gap-3"></div>
                </div>
            </div>
        </div>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
  <script>
    if (!localStorage.getItem('token')) window.location.href = 'login.html';

    // Custom language selector for admin dash
    i18n.renderLanguageSelector = function() {
        const container = document.getElementById('lang-selector-nav');
        if (!container) return;
        container.innerHTML = `
            <select id="lang-selector" class="form-select form-select-sm glass text-white w-auto">
                ${Object.entries(this.languages).map(([code, name]) => `<option value="${code}" ${code === this.currentLang ? 'selected' : ''}>${name}</option>`).join('')}
            </select>
        `;
        document.getElementById('lang-selector').onchange = (e) => i18n.loadTranslations(e.target.value).then(() => i18n.translatePage());
    }
  </script>
  <script src="js/dashboard.js"></script>
  <script src="js/chat.js"></script>
</body>
</html>
