<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Tutorify</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://unicons.iconscout.com/release/v4.0.8/css/line.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { background: var(--color-bg-dark); }
    .auth-card { max-width: 450px; margin: 100px auto; }
    .input-glass { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: white; }
    .input-glass:focus { background: rgba(255,255,255,0.1); border-color: var(--color-primary); color: white; box-shadow: 0 0 10px rgba(108, 99, 255, 0.3); }
  </style>
</head>
<body class="d-flex align-items-center min-vh-100">

  <div class="container">
    <div class="auth-card glass shadow-lg p-5 rounded-4 text-center">
        <h2 class="navbar-brand fs-2 mb-4" href="index.html">TUTORIFY</h2>
        <h3 id="formTitle" class="mb-4 fw-bold" data-i18n="login_title">Welcome Back</h3>

        <div id="loginForm">
            <div class="mb-3"><input type="email" id="loginEmail" class="form-control form-control-lg input-glass" data-i18n="email_placeholder" placeholder="Email" required></div>
            <div class="mb-3"><input type="password" id="loginPassword" class="form-control form-control-lg input-glass" data-i18n="password_placeholder" placeholder="Password" required></div>
            <div class="mb-4">
                <select id="loginRole" class="form-select input-glass">
                <option value="user" data-i18n="role_user">Student</option>
                <option value="teacher" data-i18n="role_teacher">Teacher</option>
                <option value="admin" data-i18n="role_admin">Admin</option>
                </select>
            </div>
            <button id="loginBtn" class="btn btn-neon w-100 py-3" data-i18n="login_btn">Sign In</button>
            <p class="mt-4 small text-muted">Don't have an account? <a href="#" onclick="toggleForm()" class="text-primary fw-bold" data-i18n="toggle_to_register">Create account</a></p>
        </div>

        <div id="registerForm" class="hidden">
            <div class="mb-3"><input type="text" id="regName" class="form-control form-control-lg input-glass" data-i18n="fullname_placeholder" placeholder="Full Name" required></div>
            <div class="mb-3"><input type="email" id="regEmail" class="form-control form-control-lg input-glass" data-i18n="email_placeholder" placeholder="Email" required></div>
            <div class="mb-3"><input type="password" id="regPassword" class="form-control form-control-lg input-glass" data-i18n="password_placeholder" placeholder="Password" required></div>
            <div class="mb-4">
                <select id="regRole" class="form-select input-glass">
                <option value="user" data-i18n="role_user">Student</option>
                <option value="teacher" data-i18n="role_teacher">Teacher</option>
                </select>
            </div>
            <button id="regBtn" class="btn btn-neon w-100 py-3" data-i18n="register_btn">Join Now</button>
            <p class="mt-4 small text-muted">Already a member? <a href="#" onclick="toggleForm()" class="text-primary fw-bold" data-i18n="toggle_to_login">Login</a></p>
        </div>

        <div id="message" class="mt-3"></div>
        <div id="lang-selector-container" class="mt-4 border-top border-secondary border-opacity-10 pt-3"></div>
    </div>
  </div>

  <script src="js/main.js"></script>
  <script>
    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');
    const formTitle = document.getElementById('formTitle');
    const msgEl = document.getElementById('message');

    function showMsg(text, isError = true) {
        msgEl.innerHTML = `<div class="alert ${isError ? 'alert-danger' : 'alert-success'} py-2">${text}</div>`;
    }

    function toggleForm() {
      loginForm.classList.toggle('hidden');
      registerForm.classList.toggle('hidden');
      const isLogin = !loginForm.classList.contains('hidden');
      formTitle.textContent = isLogin ? (i18n.translations['login_title'] || 'Welcome Back') : (i18n.translations['register_title'] || 'Create Account');
      msgEl.innerHTML = '';
    }

    async function handleAuth(url, body, successMsg) {
        msgEl.innerHTML = '<div class="spinner-border text-primary spinner-border-sm" role="status"></div>';
        try {
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            const data = await response.json();
            if (response.ok) {
                if (data.token) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    showMsg(successMsg, false);
                    setTimeout(() => {
                        if (data.user.onboardingStatus === 'pending') window.location.href = 'onboarding.html';
                        else if (data.user.role === 'admin') window.location.href = 'dashboard.html';
                        else if (data.user.role === 'teacher') window.location.href = 'teacher-dashboard.html';
                        else window.location.href = 'index.html';
                    }, 1000);
                } else {
                    showMsg(successMsg, false);
                    setTimeout(toggleForm, 1500);
                }
            } else {
                showMsg(data.message || 'Action failed');
            }
        } catch (error) {
            showMsg('Network error occurred');
        }
    }

    document.getElementById('loginBtn').onclick = () => {
        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPassword').value;
        const role = document.getElementById('loginRole').value;
        handleAuth('/api/auth/login', { email, password, role }, 'Login successful!');
    };

    document.getElementById('regBtn').onclick = () => {
        const name = document.getElementById('regName').value;
        const email = document.getElementById('regEmail').value;
        const password = document.getElementById('regPassword').value;
        const role = document.getElementById('regRole').value;
        handleAuth('/api/auth/register', { name, email, password, role }, 'Account created! Please login.');
    };

    // Override language selector for auth page
    const originalRender = i18n.renderLanguageSelector;
    i18n.renderLanguageSelector = function() {
        const container = document.getElementById('lang-selector-container');
        if (!container) return;

        container.innerHTML = `
            <select id="lang-selector" class="form-select form-select-sm glass text-white mx-auto w-auto">
                ${Object.entries(this.languages).map(([code, name]) =>
                    `<option value="${code}" ${code === this.currentLang ? 'selected' : ''}>${name}</option>`
                ).join('')}
            </select>
        `;
        document.getElementById('lang-selector').addEventListener('change', async (e) => {
            await this.loadTranslations(e.target.value);
            this.translatePage();
        });
    }
  </script>
    <script src="js/chat.js"></script>
</body>
</html>
