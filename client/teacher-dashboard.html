<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Studio - Tutorify</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unicons.iconscout.com/release/v4.0.8/css/line.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .studio-sidebar { height: 100vh; background: var(--color-bg-dark); border-right: 1px solid var(--color-glass-border); }
        .course-row { transition: 0.3s; }
        .course-row:hover { background: rgba(108, 99, 255, 0.05); }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-3 col-lg-2 p-4 studio-sidebar">
                <h4 class="text-primary fw-bold mb-5">STUDIO</h4>
                <ul class="nav flex-column gap-3">
                    <li class="nav-item"><a class="nav-link p-0 d-flex align-items-center gap-2" href="index.html"><i class="uil uil-home"></i> Exit Studio</a></li>
                    <li class="nav-item"><a class="nav-link active p-0 d-flex align-items-center gap-2" href="#"><i class="uil uil-video"></i> Content</a></li>
                    <li class="nav-item"><a class="nav-link p-0 d-flex align-items-center gap-2" href="#" onclick="logout()"><i class="uil uil-sign-out-alt"></i> Logout</a></li>
                </ul>
            </nav>

            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-5 pt-5">
                <div class="d-flex justify-content-between align-items-center mb-5 pb-3 border-bottom border-secondary border-opacity-10">
                    <h2 class="fw-bold">Channel Content</h2>
                    <a href="studio.html" class="btn btn-neon shadow-sm px-4"><i class="uil uil-plus-circle me-2"></i> Create New</a>
                </div>

                <div class="glass-card p-0 overflow-hidden shadow-sm border-0">
                    <div class="table-responsive">
                        <table class="table table-dark table-hover align-middle mb-0">
                            <thead class="text-muted small text-uppercase" style="background: rgba(255,255,255,0.02)">
                                <tr>
                                    <th class="ps-4">Course</th>
                                    <th>Visibility</th>
                                    <th>Date</th>
                                    <th>Stats</th>
                                    <th class="pe-4 text-end">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="teacher-courses-table" class="small">
                                <!-- Dynamic rows -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
    <script src="js/teacher-dashboard.js"></script>
    <script src="js/chat.js"></script>
</body>
</html>
